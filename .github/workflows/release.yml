name: Release

# Tag-triggered macOS release. Pushing `vX.Y` re-runs the `swift test` gate, then
# archives a Developer ID signed macOS app with the hardened runtime, notarizes
# it, zips it, signs the zip with Sparkle's EdDSA key and publishes a GitHub
# Release carrying exactly two assets: the zip and a signed `appcast.xml`.
#
# ## Why the build number is `github.run_number`
#
# `CFBundleVersion` is what Sparkle compares to decide that one build is newer
# than another, so it has to be strictly increasing across every release this
# workflow ever publishes — and `MARKETING_VERSION` cannot do that job (it is a
# dotted marketing string, and it is the *other* number). `github.run_number` is
# a per-workflow-file counter that GitHub increments on every run and never
# resets: exactly the monotonic integer `docs/RELEASING.md` asks for, produced
# without committing anything, so `git status` stays clean after a release.
#
# The caveat that comes with it: the counter is keyed on **this file's name**.
# Renaming `release.yml`, or replacing it with a differently-named workflow,
# restarts it at 1 — and a build numbered 1 published after a build numbered 12
# is a build Sparkle will never offer. If this file is ever renamed, the
# replacement must add a fixed offset (`$((github.run_number + <last shipped>))`)
# large enough to clear every number already released.
#
# ## The two independent signatures
#
# A published release carries two, and they answer different questions. Apple's
# — a Developer ID Application signature plus a stapled notarization ticket —
# is what lets a *downloaded* copy launch without Gatekeeper stopping it.
# Sparkle's is the EdDSA signature over the zip in the appcast, and it is what
# an *installed* copy checks before replacing itself. Neither substitutes for
# the other: an unnotarized build updates in place perfectly well and cannot be
# opened from a fresh download, and a notarized build with an unsigned appcast
# is one every installed copy refuses.
#
# They also fail independently, which is why the certificate secrets and the
# EdDSA secret are refused separately in the preflight: an expired Developer ID
# certificate breaks new releases and nothing already installed, while a lost
# EdDSA key strands the entire installed base forever.

on:
  push:
    tags: ['v*']

# One release run at a time, across every tag — the group is deliberately the
# workflow alone rather than the usual `${{ github.ref }}`, which would put each
# tag in its own group and let two runs overlap. They must not: `CFBundleVersion`
# is `github.run_number`, and `releases/latest` is whichever release was
# *published* last, so two interleaved runs can leave the feed advertising a
# lower build number than copies already installed — which Sparkle will never
# offer an update over, stranding them silently.
#
# `cancel-in-progress: false` buys less than it reads like, and the cost is the
# price of the shared group. It protects the run that is *already running*; a run
# still **pending** in the group is cancelled when a newer one queues into it —
# the exact GitHub behaviour `ci.yml`'s own concurrency comment documents, which
# is why that file gives every push to master a unique group. Here the shared
# group is deliberate anyway (serializing releases matters more), so the
# consequence is accepted and stated rather than designed away: pushing three
# `v*` tags in quick succession can leave the middle tag with no release and no
# failure anywhere. Recovering is deleting and re-pushing that tag — `on:` is
# tags-only, so there is no `workflow_dispatch` re-run. Push release tags one at
# a time and confirm each run finished.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Read-only by default; only the job that publishes the release widens it.
permissions:
  contents: read

jobs:
  # The same gate CI runs, pinned identically. A tag that cannot pass
  # `swift test` must not produce a release, and the static suites here are what
  # assert this very file's shape (ReleaseWorkflowTests).
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '16.4'
      - name: Run PisakaCore tests
        run: swift test

  release:
    needs: test
    runs-on: macos-15
    # Archive (~20 minutes, whole-module optimization across the app and every
    # linked dependency) plus a notary submission this job is willing to wait
    # `--timeout 30m` for. Sized so the notary wait always fails with the
    # notarize step's own actionable message rather than as a job cancellation:
    # a cancellation between `gh release create --draft` and the promotion
    # leaves a draft occupying the tag, which is the one failure here that needs
    # a manual undo.
    timeout-minutes: 90
    # Scoped to this job alone: creating a release and uploading its assets is
    # the only write this workflow performs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '16.4'

      # Everything that can refuse the release runs here, before a single
      # expensive step: an archive that takes 20 minutes and then cannot be
      # signed, or is signed by a key no installed copy trusts, is worse than a
      # refusal in the first 10 seconds.
      #
      # The five signing/notarization secrets reach this step through `env:` and
      # are only ever tested with `-z`. Nothing echoes them, and the certificate
      # itself is not decoded here — this step's whole job is to establish that
      # the run *can* be signed and notarized before anything expensive starts.
      - name: Preflight
        env:
          SPARKLE_PRIVATE_EDDSA_KEY: ${{ secrets.SPARKLE_PRIVATE_EDDSA_KEY }}
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Quote-agnostic on purpose: `MARKETING_VERSION: 1.1` is as valid a
          # YAML scalar as `"1.1"`, and a parser that only understood the quoted
          # form would yield an empty DECLARED and refuse every release with a
          # message blaming project.yml. An empty read is a parse failure, and is
          # reported as one rather than as a version mismatch.
          DECLARED="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([^"[:space:]]+)"?.*$/\1/p' project.yml | head -1)"
          if [ -z "$DECLARED" ]; then
            echo "::error::Could not read MARKETING_VERSION out of project.yml. The preflight parses it with sed; if the setting moved or changed shape, fix the parser here. See docs/RELEASING.md."
            exit 1
          fi

          # 1. The tag and the version the app will report must agree. They are
          #    two independent facts — the tag is what GitHub names the release
          #    and what the download URLs contain, MARKETING_VERSION is what the
          #    bundle carries and what Sparkle shows — and a mismatch ships a
          #    release whose appcast advertises a version the app does not have.
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "::error::Tag ${TAG} means version ${VERSION}, but project.yml declares MARKETING_VERSION \"${DECLARED}\". Bump MARKETING_VERSION and commit it before tagging, or delete and re-push the tag that matches. See docs/RELEASING.md."
            exit 1
          fi

          # 2. Without the private key nothing can sign the appcast, and Sparkle
          #    rejects an unsigned update outright.
          if [ -z "${SPARKLE_PRIVATE_EDDSA_KEY}" ]; then
            echo "::error::The SPARKLE_PRIVATE_EDDSA_KEY repository secret is empty or absent. Generate the pair once with Sparkle's bin/generate_keys, store the private half in that secret and back it up outside this repository. See docs/RELEASING.md."
            exit 1
          fi

          # 3. The public half shipped in the app must be a real key. While the
          #    committed placeholder is still there, every copy in the wild would
          #    verify updates against a key whose private half does not exist —
          #    so refuse to produce such a release at all.
          if grep -q 'UExBQ0VIT0xERVItUkVQTEFDRS1XSVRILVJFQUwtS1k=' Resources/Info.plist; then
            echo "::error::SUPublicEDKey in Resources/Info.plist is still the committed placeholder. Replace it with the public half printed by bin/generate_keys and commit that before tagging a release. See docs/RELEASING.md."
            exit 1
          fi

          # 4-8. The signing and notarization secrets. Each is refused on its
          #      own rather than as one "signing is not configured" check: the
          #      five are produced by four different one-time procedures (export
          #      the certificate, note its export password, create an App Store
          #      Connect API key, read its key id and issuer id off that page),
          #      and "one of them is missing" is not an actionable message for
          #      any of them. The archive is 20 minutes and the notary service
          #      adds up to 20 more, so a missing issuer id discovered at
          #      submission time costs the whole build.
          if [ -z "${DEVELOPER_ID_CERT_P12}" ]; then
            echo "::error::The DEVELOPER_ID_CERT_P12 repository secret is empty or absent. Export the Developer ID Application certificate and its private key from Keychain Access as a .p12, base64-encode it (base64 -i cert.p12 | pbcopy) and store that in the secret. Without it the release cannot be signed with an identity anybody trusts. See docs/RELEASING.md."
            exit 1
          fi
          if [ -z "${DEVELOPER_ID_CERT_PASSWORD}" ]; then
            echo "::error::The DEVELOPER_ID_CERT_PASSWORD repository secret is empty or absent. It is the password set when the .p12 was exported, and security import cannot read the key without it. Re-export the .p12 if the password is lost and replace both certificate secrets together. See docs/RELEASING.md."
            exit 1
          fi
          if [ -z "${APP_STORE_CONNECT_API_KEY_P8}" ]; then
            echo "::error::The APP_STORE_CONNECT_API_KEY_P8 repository secret is empty or absent. Create an App Store Connect API key (Users and Access → Integrations → App Store Connect API) and store the contents of the downloaded AuthKey_<id>.p8 in that secret — Apple lets it be downloaded exactly once. Without it notarytool cannot authenticate. See docs/RELEASING.md."
            exit 1
          fi
          if [ -z "${APP_STORE_CONNECT_KEY_ID}" ]; then
            echo "::error::The APP_STORE_CONNECT_KEY_ID repository secret is empty or absent. It is the 10-character Key ID shown next to the API key in App Store Connect, and the <id> in the AuthKey_<id>.p8 filename. See docs/RELEASING.md."
            exit 1
          fi
          if [ -z "${APP_STORE_CONNECT_ISSUER_ID}" ]; then
            echo "::error::The APP_STORE_CONNECT_ISSUER_ID repository secret is empty or absent. It is the UUID shown above the key list on the same App Store Connect page — one per team, shared by every key. See docs/RELEASING.md."
            exit 1
          fi

      # The signing identity lives in a keychain that is created for this run and
      # deleted with it (the last step of this job, `if: always()`).
      #
      # Why a temporary keychain and not the runner's login keychain: a GitHub
      # macOS runner is ephemeral, but "ephemeral" is a property of the fleet, not
      # a guarantee this workflow may lean on — and the login keychain is unlocked,
      # shared with every other step and every third-party action in this job, and
      # not ours to modify. A keychain under $RUNNER_TEMP is ours, is named
      # nowhere else, and is one `security delete-keychain` from gone. The login
      # keychain is deliberately never named in this file.
      #
      # This sits with the preflight rather than next to the archive for the same
      # reason the preflight exists: an expired certificate, a .p12 that will not
      # decode, or a certificate of the wrong *type* must stop the run in the
      # first seconds. That last one is the case worth spelling out — an Apple
      # Development certificate signs the archive perfectly happily and is then
      # rejected by the notary service twenty minutes later, so the identity is
      # checked here, by name and by team, rather than assumed.
      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/pisaka-signing.keychain-db"
          CERTIFICATE="${RUNNER_TEMP}/developer-id.p12"

          # Generated here, used by the three `security` calls below and by
          # nothing else. It is not a repository secret because it guards nothing
          # that outlives the job: the keychain it protects is deleted before the
          # runner is. It is never printed.
          KEYCHAIN_PASSWORD="$(/usr/bin/openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # `-u -t <seconds>` and deliberately no `-l`: `-l` is "lock when the
          # system sleeps", and the timeout is set well past this job's budget.
          # A keychain that re-locks during the archive fails codesign with
          # "User interaction is not allowed", which reads like a missing
          # identity and is not one.
          security set-keychain-settings -ut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # `(umask 077; …)` and not a `chmod` afterwards. The redirect creates
          # the file under the runner's default umask, so narrowing it on the
          # next line leaves a window in which the signing key is world-readable
          # — and the step's whole premise (see above) is that this job may not
          # lean on the runner being private. A subshell umask has no window at
          # all because the file is never created any other way. The .p8 in the
          # notarization step is written the same way for the same reason.
          # Both halves of the certificate secret are wrapped, like every other
          # refusal in this file, because bare they are the two least legible
          # failures in the whole workflow: a mis-pasted base64 body ends the step
          # with `base64: Invalid character in input stream.` and a password that
          # does not belong to this .p12 ends it with
          # `SecKeychainItemImport: MAC verification failed`. Neither names a
          # secret, and the two are fixed by editing *different* ones — which is
          # the case docs/RELEASING.md warns about when only one of the pair is
          # rotated. The split between the two refusals is not clean and is not
          # claimed to be: `base64 --decode` rejects invalid *characters*, not a
          # short body, so a paste truncated at a multiple of four bytes decodes
          # into a partial file and surfaces as the import failure below — which
          # is why that message names both secrets rather than blaming the
          # password on the strength of the decode having succeeded.
          (umask 077; printf '%s' "$DEVELOPER_ID_CERT_P12" | base64 --decode > "$CERTIFICATE") || {
            echo "::error::DEVELOPER_ID_CERT_P12 does not decode as base64. The secret holds the .p12 base64-encoded with no wrapping; a raw binary upload and a paste that lost characters both land here. Re-run \`base64 -i Certificates.p12 | pbcopy\` and replace the secret. See docs/RELEASING.md."
            exit 1
          }
          if ! security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12; then
            # The .p12 is removed on this path too: the failure says nothing about
            # whether the file was written, and a step that exits with the private
            # key still on disk leans on the cleanup step it exists to back up.
            rm -f "$CERTIFICATE"
            echo "::error::Importing the Developer ID certificate failed. Two causes reach here and the decode above rules out neither: DEVELOPER_ID_CERT_PASSWORD not being the password this .p12 was exported with (security reports \"MAC verification failed\"), or DEVELOPER_ID_CERT_P12 being truncated at a multiple of four bytes — base64 only rejects invalid characters, so a short paste decodes cleanly into a partial file. Read security's own message above, then replace both secrets together; they are a pair. See docs/RELEASING.md."
            exit 1
          fi
          # The decoded private key does not outlive the step that needed it.
          rm -f "$CERTIFICATE"

          # Without a partition list the first use of the key raises the
          # "wants to sign using key in your keychain" authorization dialog. On a
          # headless runner that is not a failure, it is a hang until the job
          # times out.
          #
          # `-s` restricts the update to keys that can *sign*. Without it the
          # query matches every key item in the keychain and the tool tries to
          # update each one — an item with no access control makes it exit
          # non-zero (`SecKeychainItemCopyAccess: The specified item has no
          # access control`), which under `set -e` ends the step on a key this
          # workflow never needed. Narrowing to the signing key is what every
          # known-working recipe does, and it is the only key this step imported.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Prepend, never replace. `security list-keychains -s` overwrites the
          # *whole* user search list, so passing the new keychain alone would drop
          # everything already on it for the rest of the job. The previous list is
          # saved so the cleanup step can put it back verbatim.
          #
          # The `$(cat …)` is unquoted on purpose — `-s` takes one argument per
          # keychain and word splitting is what produces them. That assumes no
          # keychain path contains whitespace, which holds for the runner's
          # `/Users/runner/Library/Keychains/…` and is the reason this is not
          # written to accept arbitrary paths.
          security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' \
            > "${RUNNER_TEMP}/keychains-before"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(cat "${RUNNER_TEMP}/keychains-before")

          # The last cheap refusal. `find-identity -v -p codesigning` lists only
          # identities usable for signing, so this covers an expired certificate,
          # a missing private key and the wrong certificate type at once — and it
          # is matched on both the certificate's kind and the team, because an
          # Apple Development identity for the same team would otherwise archive
          # happily and be rejected by the notary service.
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          # The listing the guard actually judges, not a second `find-identity`
          # run for the log: two invocations can disagree, and the one shown
          # would then not be the one that was judged.
          #
          # Printed *before* it is judged, like the codesign dump in the
          # verification step below, because the failing path is the one that
          # needs it. The refusal covers four different causes — the wrong
          # certificate type, the wrong team, an expired certificate, and a .p12
          # exported without its private key (`find-identity` exits 0 with
          # "0 valid identities found") — that need four different fixes, and
          # the canned message alone cannot tell them apart. This step is
          # reachable only from a tag, so there is no cheap second look.
          printf '%s\n' "$IDENTITIES"
          if ! printf '%s\n' "$IDENTITIES" | grep -q 'Developer ID Application:.*(XJT3LK36GS)'; then
            echo "::error::The imported certificate is not a Developer ID Application identity for team XJT3LK36GS. An Apple Development or Mac Developer certificate signs the archive but is rejected by the notary service twenty minutes later, and an expired one is not listed here at all. Re-export the Developer ID Application certificate *with its private key* from Keychain Access and replace DEVELOPER_ID_CERT_P12 and DEVELOPER_ID_CERT_PASSWORD together. See docs/RELEASING.md."
            exit 1
          fi

      # Pinned the same way XcodeGen is: exact URL, digest checked before
      # anything is extracted or executed.
      #
      # This runs *before* the archive, next to the preflight, for the reason the
      # preflight exists: a bad digest, a moved release asset or a tarball whose
      # layout changed must not be discovered after a 20-minute build. Nothing
      # here depends on the archive — `generate_appcast` is only invoked later.
      - name: Install Sparkle 2.9.5 release tools
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o sparkle-tools.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.9.5/Sparkle-2.9.5.tar.xz
          echo "015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc  sparkle-tools.tar.xz" | shasum -a 256 -c -
          mkdir -p sparkle-tools
          tar -xJf sparkle-tools.tar.xz -C sparkle-tools ./bin
          test -x sparkle-tools/bin/generate_appcast

      # Pinned exactly as ci.yml pins it — version and digest must stay in step
      # with that file (ReleaseWorkflowTests compares the two).
      - name: Install XcodeGen 2.45.4
        run: |
          curl -fsSL --retry 3 -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          sudo xcodegen/install.sh
          xcodegen --version
      - name: Cache SwiftPM source packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: SourcePackages
          key: spm-${{ hashFiles('Pisaka.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve package dependencies
        run: xcodebuild -project Pisaka.xcodeproj -resolvePackageDependencies -clonedSourcePackagesDirPath SourcePackages

      # Developer ID signed with the hardened runtime, and *every* signing
      # setting is still overridden on the command line only.
      #
      # That is a choice, not an omission. `project.yml` keeps
      # `CODE_SIGNING_ALLOWED: NO` and names no team and no identity, so a fresh
      # clone plus `xcodegen generate` plus a build stays signing-free — no
      # certificate, no prompt, no "development team required" error for anyone
      # who has never joined the program. A command-line build setting beats the
      # project value for this one invocation, which is exactly the scope the
      # release needs. (docs/RELEASING.md used to say the base setting would have
      # to move or be dropped once a team existed. It does not, and this is why.)
      #
      # `ENABLE_HARDENED_RUNTIME=YES` is a notarization requirement, and no
      # entitlements file goes with it: the hardened runtime permits `fork`/`exec`
      # by default and library validation is per-process, so the `git` subprocess,
      # the PTY shell and the downloaded language servers all launch with nothing
      # declared. An entitlement is added when a concrete failure demands one and
      # not in anticipation — every entitlement widens what the shipped app is
      # allowed to do.
      #
      # `--timestamp` is passed rather than assumed. A secure timestamp is a
      # notarization requirement; leaving it to an Xcode default would move the
      # discovery of a missing one to the notary service's rejection, twenty
      # minutes and a full archive later.
      #
      # `-configuration Release` is not decoration. The whole updater is behind
      # `#if !DEBUG` (`SoftwareUpdater.swift`), so the configuration is what
      # decides whether the shipped app can update at all — and a Debug archive
      # would still embed Sparkle.framework (the package dependency links
      # unconditionally), so every check below would pass while the release
      # shipped with "Check for Updates…" permanently disabled. Nothing else
      # pins it: the scheme is auto-created by xcodebuild (Pisaka.xcodeproj is
      # generated and gitignored, and project.yml declares no `schemes:`), so
      # "archive uses Release" would otherwise rest on an implicit Xcode default.
      - name: Archive (macOS, Developer ID signed, hardened runtime)
        run: >
          xcodebuild -project Pisaka.xcodeproj -scheme Pisaka
          -configuration Release
          -destination 'generic/platform=macOS'
          -clonedSourcePackagesDirPath SourcePackages
          -derivedDataPath DerivedData
          -archivePath build/Pisaka-macOS.xcarchive
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="Developer ID Application"
          DEVELOPMENT_TEAM=XJT3LK36GS
          ENABLE_HARDENED_RUNTIME=YES
          OTHER_CODE_SIGN_FLAGS=--timestamp
          archive

      # Xcode's archive re-signs the embedded `Sparkle.framework` *bundle* with
      # this run's identity — that much was verified and was true — but it does
      # not recurse into the framework's own nested helper bundles. Sparkle ships
      # four of them (two XPC services, `Autoupdate` and `Updater.app`) carrying
      # upstream's ad-hoc signatures: `flags=0x10002(adhoc,runtime)`, no team,
      # no `Timestamp=`. That is exactly what the notary service rejected `v1.0`
      # for, naming all four with "not signed with a valid Developer ID
      # certificate" and "does not include a secure timestamp". So they are
      # re-signed here, explicitly, before anything is verified or submitted.
      #
      # The order is inside-out because modifying nested code invalidates every
      # seal above it: signing a helper after its framework would leave the
      # framework sealing a hash that no longer matches, and signing the
      # framework after the app would do the same one level up. Hence helpers,
      # then the framework, then the app — the app last, always.
      #
      # The list is written out rather than discovered, and emphatically not
      # `--deep`. Apple documents `--deep` as a debugging convenience unsuited to
      # distribution signing (it applies one set of flags to everything it finds
      # and silently signs whatever happens to be nested), and an enumerable list
      # is the thing the verification below and the static pins in
      # `ReleaseWorkflowTests` can hold to account. A glob would hide exactly the
      # change the guards below exist to catch.
      #
      # The flags come from Sparkle's own distribution documentation for the
      # pinned 2.9.5 (sparkle-project.org, the sandboxing/code signing page),
      # which spells the sequence out as:
      #
      #     codesign -f -s "$ID" -o runtime …/XPCServices/Installer.xpc
      #     codesign -f -s "$ID" -o runtime --preserve-metadata=entitlements \
      #         …/XPCServices/Downloader.xpc      # 2.6+
      #     codesign -f -s "$ID" -o runtime …/Autoupdate
      #     codesign -f -s "$ID" -o runtime …/Updater.app
      #     codesign -f -s "$ID" -o runtime Sparkle.framework
      #
      # `--timestamp` is added on top of each: a secure timestamp is a
      # notarization requirement, and Sparkle's snippet leaves it to the Xcode
      # build setting that is not in play for a `codesign` run by hand. The
      # `--preserve-metadata=entitlements` is on `Downloader.xpc` alone because
      # that is what upstream asks for; `Autoupdate`'s shipped
      # `com.apple.application-identifier` is therefore dropped deliberately —
      # carrying an App-Store-shaped identifier belonging to a foreign team into
      # a Developer ID signature is itself a notarization finding.
      #
      # The forward hazard, stated because it is silent: the app is re-signed
      # here with no `--entitlements`, which is correct only while this release
      # ships no entitlements file. The day one is added to the archive, it has
      # to be passed on this line too — otherwise this step strips it back off
      # and nothing fails until the shipped app cannot do the thing the
      # entitlement was added for.
      - name: Re-sign Sparkle's nested helpers
        run: |
          set -euo pipefail
          APP="build/Pisaka-macOS.xcarchive/Products/Applications/Pisaka.app"
          FRAMEWORK="$APP/Contents/Frameworks/Sparkle.framework"
          IDENTITY="Developer ID Application"

          # The two coarse refusals first, because this step is now the archive's
          # immediate successor and every path below is inside the app. Without
          # them a missing product, or a Sparkle that stopped being embedded at
          # all, would be reported by the four layout guards below — sending the
          # reader off to re-derive path lists for a Sparkle version that did not
          # change. `Verify the archived app` keeps its own copies of both: it
          # must stay refusable on its own terms if the steps are ever reordered.
          if ! test -d "$APP"; then
            echo "::error::no app at ${APP}. The archive step produced nothing at the path this workflow expects; check the -archivePath on the archive command line. See docs/RELEASING.md."
            exit 1
          fi
          if ! test -d "$FRAMEWORK"; then
            echo "::error::Sparkle.framework is not embedded in the archived app — the destination-filtered package dependency stopped reaching the macOS build. See docs/RELEASING.md."
            exit 1
          fi

          # The layout is pinned to Sparkle 2.9.5's, and a version bump that
          # moved, renamed or dropped any of these four must stop the run here
          # rather than ship an ad-hoc signed helper into a submission. There is
          # nothing clever to fall back to: the list below and the verification
          # step's required set are the same fact written twice, and both have to
          # be re-derived from the new framework by hand.
          if ! test -e "$FRAMEWORK/Versions/B/XPCServices/Installer.xpc"; then
            echo "::error::Sparkle's Versions/B/XPCServices/Installer.xpc is not where this workflow expects it. The pinned Sparkle version's internal layout changed: re-derive both this step's explicit re-sign list and the verification step's required Mach-O set from the new framework before releasing. See docs/RELEASING.md."
            exit 1
          fi
          if ! test -e "$FRAMEWORK/Versions/B/XPCServices/Downloader.xpc"; then
            echo "::error::Sparkle's Versions/B/XPCServices/Downloader.xpc is not where this workflow expects it. The pinned Sparkle version's internal layout changed: re-derive both this step's explicit re-sign list and the verification step's required Mach-O set from the new framework before releasing. See docs/RELEASING.md."
            exit 1
          fi
          if ! test -e "$FRAMEWORK/Versions/B/Autoupdate"; then
            echo "::error::Sparkle's Versions/B/Autoupdate is not where this workflow expects it. The pinned Sparkle version's internal layout changed: re-derive both this step's explicit re-sign list and the verification step's required Mach-O set from the new framework before releasing. See docs/RELEASING.md."
            exit 1
          fi
          if ! test -e "$FRAMEWORK/Versions/B/Updater.app"; then
            echo "::error::Sparkle's Versions/B/Updater.app is not where this workflow expects it. The pinned Sparkle version's internal layout changed: re-derive both this step's explicit re-sign list and the verification step's required Mach-O set from the new framework before releasing. See docs/RELEASING.md."
            exit 1
          fi

          # The six invocations below are the only commands in this step that
          # could fail without an `::error::` of their own, and their likeliest
          # failures are transient rather than structural — so they get one, as
          # an `ERR` trap rather than a `|| { … }` on each line. That shape is
          # deliberate: the ordering assertions in ReleaseWorkflowTests match
          # these lines by their exact trailing path, and appending anything to
          # them would break the pins that make the inside-out order checkable.
          RESIGN_FAILURE="::error::Re-signing Sparkle inside the archived app failed on the invocation above. The likeliest causes are transient: Apple's timestamp authority refusing or rate-limiting the request (--timestamp reaches it six times in this step, on top of the archive's), or the throwaway signing keychain having re-locked since the import step — which is reported as \"User interaction is not allowed\" and reads like a missing identity without being one. The structural cause is a second Developer ID Application identity in that keychain, which makes the identity match ambiguous. Re-running the job is the first response; a re-run needs the tag deleted and pushed again, which archives under a fresh github.run_number. See docs/RELEASING.md."
          trap 'echo "$RESIGN_FAILURE"' ERR

          codesign --force --sign "$IDENTITY" --options runtime --timestamp "$FRAMEWORK/Versions/B/XPCServices/Installer.xpc"
          codesign --force --sign "$IDENTITY" --options runtime --timestamp --preserve-metadata=entitlements "$FRAMEWORK/Versions/B/XPCServices/Downloader.xpc"
          codesign --force --sign "$IDENTITY" --options runtime --timestamp "$FRAMEWORK/Versions/B/Autoupdate"
          codesign --force --sign "$IDENTITY" --options runtime --timestamp "$FRAMEWORK/Versions/B/Updater.app"
          codesign --force --sign "$IDENTITY" --options runtime --timestamp "$FRAMEWORK"
          codesign --force --sign "$IDENTITY" --options runtime --timestamp "$APP"

      # The app is taken straight out of the archive, deliberately: by the time
      # this step runs it already carries the shipping Developer ID signature and
      # the hardened runtime — the archive's, replaced in place by the re-sign
      # pass above — so `-exportArchive` would only re-sign it under a third
      # configuration on top of the two already applied: an
      # export options plist whose team, identity and signing style have to be
      # kept in step with the archive's command line forever, with the two
      # disagreeing failing at the notary service rather than here.
      #
      # What this step proves is the signature *is* what notarization requires,
      # rather than assuming that `codesign --verify` passing means the right
      # certificate was used: an ad-hoc signature, an Apple Development identity
      # and a Developer ID one all verify happily. The three facts the notary
      # service checks — a Developer ID Application authority, this team, the
      # hardened runtime flag and a secure timestamp — are therefore read back off
      # the bundle, on the app and on the embedded framework both, one fact per
      # line of the dump. The framework is not decoration: it is
      # signed by Xcode as part of the archive, and it is the one piece of nested
      # code whose signature Sparkle itself re-checks on the user's machine.
      #
      # Those two are bundle-level reads, and bundle-level was not enough: `v1.0`
      # passed both, passed `codesign --verify --deep --strict` on the whole app,
      # and was rejected by the notary service naming four Mach-Os nested inside
      # `Sparkle.framework`. `--deep --strict` asks whether every nested signature
      # is *valid*, and an ad-hoc signature is a perfectly valid signature —
      # validity is not identity, which is the entire distinction this step
      # exists to draw. So the same four facts now also run over **every Mach-O
      # in the app**, enumerated rather than listed, with two refusals guarding
      # the enumeration itself (see below). The two bundle-level checks stay
      # alongside it, and what they add is *independence* rather than extra
      # facts: `codesign --display` on a bundle reports the same four lines as on
      # that bundle's main executable, so the loop already covers both — but the
      # loop covers them only for as long as the enumeration works, and these two
      # name their targets by path. The resource seal is not what they carry;
      # that is `codesign --verify --deep --strict` above, which is why deleting
      # it because "the four facts are checked per binary" is refused too.
      #
      # These checks are still not exhaustive and are not meant to be. The notary
      # service remains the authority on every entitlement and every
      # hardened-runtime violation. This is the cheap subset that catches the
      # whole-build mistakes locally, twenty minutes before the notary would.
      - name: Verify the archived app
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP="build/Pisaka-macOS.xcarchive/Products/Applications/Pisaka.app"
          test -d "$APP" || { echo "::error::no app at ${APP}"; exit 1; }
          test -d "$APP/Contents/Frameworks/Sparkle.framework" || {
            echo "::error::Sparkle.framework is not embedded in the archived app — the destination-filtered package dependency stopped reaching the macOS build."
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$APP"

          # `codesign --display` writes to stderr, hence the redirect. Each of the
          # four facts is matched on its own line of that dump rather than as one
          # regular expression over the whole thing, for the reason the plist loop
          # below spells out: an alternation succeeds on any one alternative.
          verify_developer_id_signature() {
            LABEL="$1"
            TARGET="$2"
            # `|| true`: an unsigned or damaged bundle makes `codesign --display`
            # itself exit non-zero, and under `set -e` that would end the step
            # with no `::error::` line at all. Keeping the output and letting the
            # four checks below fail on it is what turns that case into a
            # message naming which fact is missing.
            SIGNATURE="$(codesign --display --verbose=4 "$TARGET" 2>&1 || true)"
            # Printed before it is judged, like the spctl assessment below. Each
            # refusal names one missing fact; the dump is what says *what was
            # there instead* — and in the `|| true` case above it is codesign's
            # own error text, which the first refusal would otherwise replace
            # with "is not signed by a Developer ID Application certificate" and
            # send the reader after the wrong cause. This step is reached after
            # the archive, so there is no cheap second look.
            printf '%s\n' "$SIGNATURE"

            if ! printf '%s\n' "$SIGNATURE" | grep -q '^Authority=Developer ID Application:'; then
              echo "::error::${LABEL} is not signed by a Developer ID Application certificate. An ad-hoc signature and an Apple Development identity both pass codesign --verify and are both rejected by the notary service. Check the identity the archive step selected and the certificate in DEVELOPER_ID_CERT_P12. See docs/RELEASING.md."
              exit 1
            fi
            if ! printf '%s\n' "$SIGNATURE" | grep -q '^TeamIdentifier=XJT3LK36GS'; then
              echo "::error::${LABEL} carries a team identifier other than XJT3LK36GS. Notarization is per-team, and a build signed under another team is one this team's App Store Connect key cannot submit. See docs/RELEASING.md."
              exit 1
            fi
            if ! printf '%s\n' "$SIGNATURE" | grep -q 'flags=.*runtime'; then
              echo "::error::${LABEL} was not signed with the hardened runtime. ENABLE_HARDENED_RUNTIME=YES stopped reaching the archive; the notary service refuses any build without it. See docs/RELEASING.md."
              exit 1
            fi
            # The read-back for `OTHER_CODE_SIGN_FLAGS=--timestamp`, and the only
            # one of the four that is *distinguishable* rather than absent:
            # `codesign --display` prints `Timestamp=` for a signature carrying a
            # secure timestamp from Apple's timestamp authority and `Signed Time=`
            # for a purely local one. A bundle with only the latter passes
            # `--verify --deep --strict` and all three checks above, and is
            # refused by the notary service after the archive and the queue —
            # which is the cost passing the flag explicitly exists to avoid, so
            # the flag having actually reached the signature is checked rather
            # than assumed. Two things can drop it silently: on the archive's
            # side `OTHER_CODE_SIGN_FLAGS` holds one value, so a `settings.base`
            # entry in project.yml displacing it leaves no timestamp; and the
            # re-sign step above replaces six of these signatures outright, which
            # is why it passes `--timestamp` on every one of its invocations.
            # Hence this runs at all three call sites, like the rest.
            if ! printf '%s\n' "$SIGNATURE" | grep -q '^Timestamp='; then
              echo "::error::${LABEL} carries no secure timestamp — codesign reports \"Signed Time=\" rather than \"Timestamp=\" when OTHER_CODE_SIGN_FLAGS=--timestamp did not reach the signature. The notary service refuses a build without one. See docs/RELEASING.md."
              exit 1
            fi
            echo "${LABEL}: Developer ID, team XJT3LK36GS, hardened runtime, secure timestamp"
          }

          verify_developer_id_signature "The archived app" "$APP"
          verify_developer_id_signature "The embedded Sparkle.framework" "$APP/Contents/Frameworks/Sparkle.framework"

          # Every Mach-O in the app, discovered rather than listed. `-type f` is
          # what makes "discovered" mean "once each": a framework is a tree of
          # symlinks (`Versions/Current`, the top-level links), and following
          # them would check the same binary several times under several names
          # while proving nothing extra. The `-exec … \; -print` combination is
          # the filter — `file -b` describes each candidate and `find` prints
          # only the ones `grep` recognized as Mach-O — so a resource, a plist or
          # a nib costs one `file` call and is skipped.
          #
          # `codesign --display` on a nested bundle's *executable* reports that
          # bundle's signature (identifier, authority, flags, timestamp), so
          # enumerating Mach-Os covers `Updater.app` and the two XPC services
          # without a second, bundle-shaped walk.
          MACH_OS="$(find "$APP" -type f -exec sh -c 'file -b "$1" | grep -q Mach-O' _ {} \; -print)"
          printf '%s\n' "$MACH_OS"

          # An empty enumeration is a refusal, not a pass. Two tools' output is
          # parsed here, and either could stop matching without failing: a `file`
          # whose wording changed, a `find` predicate that silently matches
          # nothing after a layout change. The loop below would then run zero
          # times, print nothing, and leave this step — and every assertion in
          # ReleaseWorkflowTests about it — green while checking no binary at all.
          # That is the exact shape of the bug this recursion was added to catch,
          # so it must not be reachable through the recursion itself.
          if [ -z "$MACH_OS" ]; then
            echo "::error::No Mach-O binaries were found inside the archived app. The enumeration this step's per-binary signature check depends on (find -type f filtered through file) matched nothing, which cannot be true of a built app — so the check ran over nothing rather than passing. Fix the enumeration here before releasing. See docs/RELEASING.md."
            exit 1
          fi

          # The floor under the enumeration, and the counterpart to the re-sign
          # step's explicit list: the four helper binaries the notary service
          # named when it rejected v1.0 must be *among* what was enumerated, by
          # exact path. If a Sparkle version moves or renames one of them, the
          # re-sign list is stale — and this refuses here rather than letting the
          # submission discover it twenty minutes later. The re-sign step guards
          # the same four bundles by existence; these are the Mach-Os inside
          # them, which is the level the notary service reports at.
          for REQUIRED in \
            "Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc/Contents/MacOS/Downloader" \
            "Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Installer.xpc/Contents/MacOS/Installer" \
            "Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate" \
            "Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app/Contents/MacOS/Updater"; do
            if ! printf '%s\n' "$MACH_OS" | grep -qxF "$APP/$REQUIRED"; then
              echo "::error::${REQUIRED} is not among the Mach-O binaries found in the archived app. The pinned Sparkle version's internal layout changed, which also makes the re-sign step's explicit list stale: re-derive both from the new framework before releasing. These four are the binaries the notary service named when it rejected v1.0. See docs/RELEASING.md."
              exit 1
            fi
          done

          # Fed by a here-string rather than a pipe on purpose: a `while` on the
          # right-hand side of a pipeline runs in a subshell, where the `exit 1`
          # inside verify_developer_id_signature would end that subshell and let
          # the step carry on to the notarization with a failed binary behind it.
          # The label is the path relative to the app so a refusal names which
          # binary failed, not just that one did.
          while IFS= read -r BINARY; do
            RELATIVE="${BINARY#"$APP/"}"
            verify_developer_id_signature "$RELATIVE" "$BINARY"
          done <<< "$MACH_OS"

          # One extraction per key, not one `grep -E` alternation over the whole
          # dump: `grep` succeeds when *any* alternative matches, and
          # CFBundleVersion is always generated — so a merge that stopped
          # carrying the two Sparkle keys (they come from the partial
          # Resources/Info.plist, which GENERATE_INFOPLIST_FILE cannot produce)
          # would leave this step green and publish an app that can never find an
          # update. `plutil -extract` exits non-zero on an absent key.
          for KEY in CFBundleVersion CFBundleShortVersionString SUFeedURL SUPublicEDKey; do
            VALUE="$(/usr/bin/plutil -extract "$KEY" raw -o - "$APP/Contents/Info.plist")" || {
              echo "::error::${KEY} is missing from the archived app's Info.plist. The partial Resources/Info.plist stopped being merged into Xcode's generated one — without SUFeedURL/SUPublicEDKey the shipped app can never find or verify an update."
              exit 1
            }
            test -n "$VALUE" || { echo "::error::${KEY} is present but empty in the archived app's Info.plist."; exit 1; }

            # CFBundleVersion is the one key in this loop whose *value* matters
            # rather than its presence. `project.yml` commits
            # `CURRENT_PROJECT_VERSION: 1` and the archive overrides it on the
            # command line; anything that stopped that override reaching the
            # merged plist (a hardcoded value, an INFOPLIST_KEY_CFBundleVersion,
            # a settings file that wins over the command line) would ship build 1
            # with every presence check above still green — and a build numbered
            # 1 published after 12 is one Sparkle will never offer, stranding
            # every installed copy silently. So the number the app actually
            # carries is compared to the number this run means.
            if [ "$KEY" = CFBundleVersion ] && [ "$VALUE" != "${{ github.run_number }}" ]; then
              echo "::error::The archived app carries CFBundleVersion ${VALUE}, but this run's build number is ${{ github.run_number }}. The CURRENT_PROJECT_VERSION override stopped reaching the merged Info.plist; publishing this would offer installed copies a build that is not newer than theirs. See docs/RELEASING.md."
              exit 1
            fi

            # CFBundleShortVersionString is the second value-carrying key, and
            # the one the whole "tag and version agree" invariant is about. The
            # preflight already compares the tag against MARKETING_VERSION — but
            # it does so by parsing `project.yml` with `sed` and taking the first
            # match, which is not the *effective* build setting: a
            # per-configuration or per-destination override under `configs:`/
            # `settings:`, or simply a second occurrence sorting first, would let
            # the preflight compare the tag against a value the archive does not
            # use. Publishing then advertises a version the app does not have,
            # which is precisely what the preflight exists to prevent, with every
            # other check green. So the archive — not the parse — is the
            # authority here, exactly as it is for CFBundleVersion above.
            if [ "$KEY" = CFBundleShortVersionString ] && [ "$VALUE" != "$VERSION" ]; then
              echo "::error::The archived app carries CFBundleShortVersionString ${VALUE}, but tag ${GITHUB_REF_NAME} means version ${VERSION}. The preflight's project.yml parse and the effective build setting disagree; publishing this would ship an appcast advertising a version the app does not report. See docs/RELEASING.md."
              exit 1
            fi

            echo "${KEY} = ${VALUE}"
          done

      # Everything above this line is byte-level. `codesign --verify`, the four
      # signing facts read back per Mach-O, the plist keys — all of them read
      # what is *in* the bundle, and none of them executes it. `v1.0` passed
      # every one of them and then aborted in dyld on the first machine that
      # opened it, unable to resolve `@rpath/Sparkle.framework/Versions/B/
      # Sparkle` because the target carried XcodeGen's iOS-shaped
      # `LD_RUNPATH_SEARCH_PATHS` on macOS too. A dynamic-link failure is
      # invisible until something runs the thing, so this step runs it.
      #
      # Its twin in ci.yml is the same script against the DerivedData product;
      # ReleaseWorkflowTests asserts the two bodies are identical apart from the
      # `APP=` line, because two hand-maintained copies drifting apart means one
      # half of the pipeline stops checking what the other does. The rest of the
      # design — success is being killed at the deadline, the app exiting on its
      # own is a refusal whatever its status, liveness polled with `kill -0`
      # rather than told apart from `wait`'s exit code — is written out in full
      # over there and pinned by the same tests.
      #
      # It sits *here*, and not somewhere more convenient, for two reasons:
      #
      #  * after the re-sign, so what it launches is what ships — hardened
      #    runtime, Developer ID signature, Sparkle's four nested helpers
      #    already replaced. Launching before the re-sign would exercise a
      #    bundle this run then throws away. Not yet notarized, which changes
      #    nothing here: nothing quarantined this bundle, so Gatekeeper is not
      #    in play and the launch says nothing about whether Apple will accept
      #    it — that is the notary's answer, in the step below.
      #  * before the submission, so a build that cannot start never reaches the
      #    notary queue. The alternative costs twenty minutes and a full archive
      #    to learn what five seconds answers here, and — worse — leaves a dead
      #    build one accepted verdict away from a publish.
      #
      # Launching does not modify the bundle. That is not an assumption: the
      # staple step's `codesign --verify --deep --strict` runs afterwards and is
      # the standing proof, so a launch that somehow did touch a seal would fail
      # the release rather than ship quietly.
      - name: Launch the archived app (smoke test)
        run: |
          set -euo pipefail
          # The one line that differs between this step and its twin in
          # ci.yml; ReleaseWorkflowTests asserts everything else is
          # identical, because two hand-maintained copies drifting apart means
          # one half of the pipeline stops checking what the other does.
          APP="build/Pisaka-macOS.xcarchive/Products/Applications/Pisaka.app"
          EXECUTABLE="$APP/Contents/MacOS/Pisaka"
          DEADLINE=5
          LOG="${RUNNER_TEMP:-/tmp}/smoke-launch.log"
          if ! test -x "$EXECUTABLE"; then
            echo "::error::No executable at ${EXECUTABLE}. The build above reported success, so either the product moved or it is not what this step thinks it is — check the -derivedDataPath and the configuration. See docs/RELEASING.md."
            exit 1
          fi
          "$EXECUTABLE" > "$LOG" 2>&1 &
          PID=$!
          ALIVE=1
          for _ in $(seq "$DEADLINE"); do
            sleep 1
            if ! kill -0 "$PID" 2>/dev/null; then
              ALIVE=0
              break
            fi
          done
          if [ "$ALIVE" -eq 0 ]; then
            STATUS=0
            wait "$PID" || STATUS=$?
            cat "$LOG"
            CRASH="$(ls -t "$HOME/Library/Logs/DiagnosticReports/Pisaka"*.ips 2>/dev/null | head -1 || true)"
            if [ -n "$CRASH" ]; then
              cat "$CRASH"
            fi
            echo "::error::The app exited on its own with status ${STATUS} before the ${DEADLINE}s deadline. The output above is the whole evidence: a 'Library not loaded: @rpath/...' line is a dynamic-link failure — the runpath the executable searches does not reach Contents/Frameworks/, which is what LD_RUNPATH_SEARCH_PATHS[sdk=macosx*] in project.yml exists to set. Any other output is a crash in startup. This step refuses whatever the status is, including 0. See docs/RELEASING.md."
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo "The app survived ${DEADLINE}s and was terminated by this step."

      # Notarization: Apple's service inspects the signed app and, if it accepts
      # it, records a ticket against its code directory hash. Nothing about the
      # app changes here — the acceptance lives on Apple's side until the next
      # step staples it into the bundle.
      #
      # The zip submitted here is **not** the zip that ships. It is a scratch
      # artefact whose only job is to carry the bundle to the notary service in
      # one piece; the shipped one is produced after stapling, from the same
      # `.app`, by the existing "Stage the update archive" step. Producing it
      # twice is deliberate: the ticket has to be inside the bundle *before* the
      # copy users download is made, and reusing this zip would ship an
      # unstapled app that needs Apple's server reachable on first launch.
      # It is `ditto` for the same symlink reason the shipped zip is — the
      # notary service unpacks what it is given and checks the framework inside.
      #
      # The API key is written to disk because `notarytool` takes a path and not
      # a value. It lands under $RUNNER_TEMP and is removed by a `trap` on exit
      # rather than by a line at the end of the script: every path out of this
      # step — the submission failing, the status check refusing, `set -e`
      # firing on anything above — must still take the key with it, and only the
      # trap covers the ones that do not reach the end.
      #
      # The exit code is deliberately not trusted to distinguish a rejected
      # build from an accepted one. `notarytool submit --wait` reports transport
      # and authentication failures through it, but the *verdict* is a field in
      # the JSON, and a workflow that reads only `$?` can publish an `Invalid`
      # submission on a service change or read a network error as a rejection.
      # So the status is read explicitly, and anything other than `Accepted`
      # fetches the log first: a rejection names the offending binary and the
      # reason, and a rejection with no log printed is a rejection nobody can
      # act on without re-running the whole release to see it.
      - name: Notarize the archived app
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="build/Pisaka-macOS.xcarchive/Products/Applications/Pisaka.app"
          API_KEY="${RUNNER_TEMP}/notary-key.p8"
          SUBMISSION="${RUNNER_TEMP}/notarization.json"
          trap 'rm -f "$API_KEY"' EXIT

          # `(umask 077; …)`, not a write followed by `chmod 600`: the redirect
          # is what creates the file, so a chmod on the next line narrows a key
          # that was already world-readable for the length of the write. This is
          # the unencrypted half of the notarization credentials — the .p12 in
          # the import step is written the same way.
          (umask 077; printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$API_KEY")

          rm -rf build/notarization
          mkdir -p build/notarization
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/notarization/Pisaka.zip

          # `|| SUBMIT_EXIT=$?` rather than a bare invocation: `set -e` would
          # otherwise end the step on a rejected submission before the status
          # check below could read the verdict or fetch the log, which is the
          # one case this step exists to report properly.
          SUBMIT_EXIT=0
          xcrun notarytool submit build/notarization/Pisaka.zip \
            --key "$API_KEY" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait \
            --timeout 30m \
            --output-format json > "$SUBMISSION" || SUBMIT_EXIT=$?
          cat "$SUBMISSION"

          # Both reads are guarded: `jq` exits non-zero on input that is not
          # valid JSON, and under `set -e` a failing command substitution in an
          # assignment ends the step *here* — before the ::error:: message,
          # before the log fetch, on exactly the malformed-output case (a
          # submission killed mid-write, a tool change emitting plain text) this
          # refusal exists to explain. An unreadable status is not `Accepted`,
          # so it falls through to the guard below and is reported like any
          # other verdict.
          STATUS="$(jq -r '.status // "no status"' "$SUBMISSION" 2>/dev/null || echo "unreadable")"
          SUBMISSION_ID="$(jq -r '.id // ""' "$SUBMISSION" 2>/dev/null || echo "")"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::The notary service returned status \"${STATUS}\" (notarytool exit ${SUBMIT_EXIT}) for submission \"${SUBMISSION_ID}\". The log follows; it names the binary and the reason — a missing hardened runtime, a missing secure timestamp, an unsigned nested executable, or an identity the service does not accept. Nothing has been published: fix the cause, delete and re-push the tag. See docs/RELEASING.md."
            # The fetch is guarded on the id being non-empty rather than left to
            # fail: on exactly the cases the guarded `jq` above exists for — the
            # `--timeout` expiring, a submission killed mid-write, notarytool
            # emitting something that is not JSON — `$SUBMISSION_ID` is the empty
            # string, and `notarytool log ""` then fails with a message about a
            # malformed id that has nothing to do with the actual problem. That
            # branch needs the *other* recovery, `notarytool history`, because
            # the id it would otherwise tell the operator to re-run with was
            # never captured by anything.
            if [ -z "$SUBMISSION_ID" ]; then
              echo "::error::notarytool returned no readable submission id, so there is no log to fetch — the JSON above is the whole record of this attempt. Find the submission and its verdict with: xcrun notarytool history --key-id \"\$APP_STORE_CONNECT_KEY_ID\" --issuer \"\$APP_STORE_CONNECT_ISSUER_ID\" --key <path-to-p8>, then: xcrun notarytool log <submission-id> …"
            else
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$API_KEY" \
                --key-id "$APP_STORE_CONNECT_KEY_ID" \
                --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
                || echo "::error::The notarization log for submission \"${SUBMISSION_ID}\" could not be fetched. Read it by hand with: xcrun notarytool log ${SUBMISSION_ID} --key-id \"\$APP_STORE_CONNECT_KEY_ID\" --issuer \"\$APP_STORE_CONNECT_ISSUER_ID\" --key <path-to-p8>"
            fi
            exit 1
          fi
          echo "Notarization accepted (submission ${SUBMISSION_ID})."

      # Stapling writes the ticket Apple issued into the bundle, which is what
      # makes a *downloaded* copy launch on a machine that cannot reach Apple —
      # an accepted-but-unstapled app is one whose first launch depends on the
      # network and on the notary service being up.
      #
      # `stapler validate` is not the same statement as `stapler staple`
      # succeeding: it re-reads the ticket back out of the bundle and checks it
      # against the bundle's own code directory hash, which is what catches a
      # ticket stapled to something other than what was submitted.
      #
      # The signature is re-verified afterwards because stapling modifies the
      # bundle. It is supposed to be signature-neutral — the ticket is stored
      # outside the sealed resources for exactly that reason — and this step
      # proves it for this build instead of taking it on trust, before the zip
      # every user downloads is made from the result.
      #
      # `spctl --assess` is the assertion this whole ticket exists for, and it
      # is the only check here that answers the actual question: would Gatekeeper
      # let this app run. It is the *system* policy talking rather than
      # `codesign`, so it covers the combination — Developer ID signature, plus
      # hardened runtime, plus a stapled ticket — that no individual check above
      # can. What a runner structurally cannot do is a real double-click of a
      # real download, which is why docs/RELEASING.md keeps that as a manual pass.
      - name: Staple the notarization ticket
        run: |
          set -euo pipefail
          APP="build/Pisaka-macOS.xcarchive/Products/Applications/Pisaka.app"

          # Wrapped like every other refusal in this file. Bare, a failure here
          # ends the job with stapler's own output, which for the common case is
          # "The staple and validate action failed! Error 65" and names nothing —
          # in a step reached only after a 20-minute archive and an accepted
          # submission, i.e. the most expensive place in the run to be told
          # nothing. The two realistic causes are named because they need
          # opposite responses.
          if ! xcrun stapler staple "$APP"; then
            echo "::error::Stapling the notarization ticket into the app failed. The submission came back Accepted, so the two realistic causes are a ticket Apple has not finished publishing yet (wait a few minutes, then delete and re-push the tag) and a bundle that changed after it was submitted (a bug here; nothing may modify the app between the submit and this step). Re-pushing is not a cheap retry: the build number is github.run_number, so the re-run archives a different CFBundleVersion and submits a build the notary service has never seen — a full archive and a fresh notarization, not a cached verdict. Nothing has been published. See docs/RELEASING.md."
            exit 1
          fi
          if ! xcrun stapler validate "$APP"; then
            echo "::error::The notarization ticket does not validate against the archived app. The ticket is issued for the code directory hash that was submitted, so this means the bundle changed between submission and stapling. Nothing has been published; re-run the release. See docs/RELEASING.md."
            exit 1
          fi

          # Stapling must not disturb the signature. If it ever did, the failure
          # would surface as a rejected *update* on the user's machine, because
          # Sparkle re-checks the signature of what it unpacks.
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Captured, and the verdict read off the output rather than off the
          # exit status — the same reasoning the notary verdict is parsed by
          # instead of inferred from `$?`. `spctl` exits 0 for *any* accepting
          # rule, and which rule accepted is the whole assertion. Three
          # acceptances that are not this one, all of them exit 0:
          # `source=Mac App Store`; `source=Developer ID`, which is what an
          # accepted but *unstapled* Developer ID app reports (verified against
          # one) — so this line also re-states, from the system's side, what
          # `stapler validate` above asserts from the bundle's; and, on a machine
          # whose assessments were turned off (`spctl --master-disable`, a
          # runner-image detail this workflow neither controls nor can see),
          # everything on disk with `source=no usable signature`. Only a
          # Developer ID signature carrying a stapled ticket reads
          # `source=Notarized Developer ID`, and that is the claim being made.
          #
          # `2>&1` because spctl writes the assessment to stderr: without it
          # $ASSESSMENT is empty and the check below refuses every run.
          ASSESSMENT=""
          if ! ASSESSMENT="$(spctl --assess --type execute --verbose=4 "$APP" 2>&1)"; then
            printf '%s\n' "$ASSESSMENT"
            echo "::error::Gatekeeper refuses the stapled app (spctl --assess). This is the one check that answers the question the release is for — whether a downloaded copy runs — and it failing here means it would fail on every user's machine instead. Read the assessment above; it names which of the signature, the hardened runtime or the ticket is the problem. See docs/RELEASING.md."
            exit 1
          fi
          printf '%s\n' "$ASSESSMENT"
          if ! printf '%s\n' "$ASSESSMENT" | grep -q '^source=Notarized Developer ID$'; then
            echo "::error::Gatekeeper accepted the stapled app under a rule other than a stapled Developer ID ticket — the assessment above does not say \"source=Notarized Developer ID\". An acceptance on any other rule says nothing about a user's download: it is either an evaluation of something that is not this signature, or a runner whose assessments are disabled, in which case this gate accepted an app it never actually assessed. Nothing has been published. See docs/RELEASING.md."
            exit 1
          fi

      # `ditto -c -k` and not `zip`: the embedded Sparkle.framework is a bundle
      # of symlinks (Versions/Current, the top-level links), and a plain `zip`
      # stores them as duplicated regular files — the unzipped framework then
      # fails its own signature check and Sparkle refuses the update.
      #
      # The staging directory holds the zip and nothing else, because
      # generate_appcast reads *every* update it finds in the directory it is
      # pointed at.
      #
      # This step is unchanged by notarization and its position is not: it runs
      # after the staple, so the bundle it archives already carries the ticket.
      # Moving it above the staple would ship an app whose first launch needs
      # Apple's service reachable — green here, and a spinner on a user's
      # machine.
      - name: Stage the update archive
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf build/release-assets
          mkdir -p build/release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            build/Pisaka-macOS.xcarchive/Products/Applications/Pisaka.app \
            "build/release-assets/Pisaka-${VERSION}.zip"
          ls -l build/release-assets

      # The private key travels on stdin (`--ed-key-file -`) and never lands on
      # disk. `--download-url-prefix` is the release's own asset URL prefix, so
      # the enclosure the appcast advertises is the zip attached below; the feed
      # itself is fetched through releases/latest/download/appcast.xml, which is
      # why the asset name at the end of this job is load-bearing.
      - name: Generate and sign the appcast
        env:
          SPARKLE_PRIVATE_EDDSA_KEY: ${{ secrets.SPARKLE_PRIVATE_EDDSA_KEY }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "$SPARKLE_PRIVATE_EDDSA_KEY" | ./sparkle-tools/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/HawkeyePierce89/pisaka/releases/download/${TAG}/" \
            --link "https://github.com/HawkeyePierce89/pisaka" \
            -o appcast.xml \
            build/release-assets
          cat appcast.xml

          # The one failure `generate_appcast` does *not* report through its exit
          # code. When the app's SUPublicEDKey is not the mate of the private key
          # on stdin, the tool prints "Warning: SUPublicEDKey in the app … does
          # not match key EdDSA in the Keychain", leaves the signature nil and
          # exits 0 (Appcast.swift only rethrows `signingError`, which that branch
          # deliberately does not set; FeedXML.swift then simply omits the
          # attribute). The result is a well-formed feed advertising a real update
          # with nothing to verify it — which every installed copy rejects, and
          # which is unrecoverable for them in exactly the way the placeholder
          # refusal in the preflight exists to prevent. The preflight cannot catch
          # this: it can see that the committed key is no longer the placeholder,
          # but not that it pairs with a secret it must never read. So the check
          # is on the artefact instead, and it is the last thing before publishing.
          if ! grep -q 'sparkle:edSignature=' appcast.xml; then
            echo "::error::The generated appcast carries no sparkle:edSignature. Almost certainly SUPublicEDKey in Resources/Info.plist is not the public half of the SPARKLE_PRIVATE_EDDSA_KEY secret — generate_appcast warns and exits 0 in that case. On the machine holding the pair run bin/generate_keys -p to print the public half, check it against Resources/Info.plist and against what the secret was set to, fix whichever is wrong, and re-tag. Publishing this feed would offer every installed copy an update it must reject. See docs/RELEASING.md."
            exit 1
          fi

      # Exactly two assets. `appcast.xml` must keep that literal name: it is the
      # last path component of SUFeedURL in Resources/Info.plist, and GitHub's
      # releases/latest/download/<asset> redirect resolves by asset name.
      #
      # Created as a **draft** and promoted only once both assets are on it.
      # `gh release create` is not transactional: it creates the release first
      # and uploads each asset afterwards, so a transient failure on the second
      # upload — a 5xx, a network blip, a cancelled job — leaves a *published*
      # release carrying the zip and no feed. `releases/latest` is exactly what
      # SUFeedURL resolves through and it skips drafts, so a draft is invisible
      # to every installed copy while a published release missing `appcast.xml`
      # makes that URL 404 for all of them, silently, until someone notices. The
      # whole concurrency comment at the top of this file reasons about avoiding
      # that state; this is what actually prevents it.
      #
      # The notes say what the release *is* and nothing else. They used to carry
      # the Gatekeeper workaround every ad-hoc-signed download needed; the app is
      # now signed and stapled, so that instruction would tell users to strip a
      # quarantine flag that stops nothing — and, worse, would keep teaching a
      # habit ("run this command on downloads that will not open") that is
      # exactly what code signing exists to make unnecessary. Release notes are
      # permanent: one left in place outlives the release it shipped with.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes "Pisaka ${VERSION} (build ${{ github.run_number }}) for macOS 13 or later. Signed with a Developer ID Application certificate, notarized by Apple and stapled: download the zip, unzip it, move Pisaka to Applications and open it. Installed copies offer this release to themselves through Sparkle." \
            "build/release-assets/Pisaka-${VERSION}.zip" \
            "appcast.xml"

          # Set equality over the asset names, both sides sorted by jq so the
          # comparison does not depend on shell locale collation. An extra asset
          # is as much a reason to stop as a missing one: it means this step
          # attached something the feed contract does not describe.
          NAMES="$(gh release view "$TAG" --json assets --jq '[.assets[].name] | sort | join(", ")')"
          EXPECTED="$(jq -rn --arg zip "Pisaka-${VERSION}.zip" '[$zip, "appcast.xml"] | sort | join(", ")')"
          if [ "$NAMES" != "$EXPECTED" ]; then
            echo "::error::The draft release carries assets [${NAMES}] rather than exactly [${EXPECTED}] — an upload failed part-way. The release is still a draft and so is invisible to installed copies; delete it, delete and re-push the tag, and let the run start over. Promoting it as-is would publish a release that either 404s SUFeedURL for every installed copy or offers a feed with no update behind it. See docs/RELEASING.md."
            exit 1
          fi

          # The one irreversible line in this workflow: after it, releases/latest
          # is this release and every installed copy reads its appcast.
          gh release edit "$TAG" --draft=false

      # `if: always()` and last, so no path through this job — success, any
      # failure above, or a cancellation — leaves either private key on the runner
      # or the search list rewritten. The runner is thrown away afterwards, which
      # is an argument for not caring and not a reason to rely on it: the cleanup
      # is four commands and it is the difference between "the keys are gone
      # because we removed them" and "the keys are gone because we assume the
      # fleet removed them".
      #
      # No `set -e`: this step's whole point is to run all of it. A failure to
      # restore the search list must not skip deleting the keychain — with
      # `errexit` the first failing command would abandon the rest of the
      # cleanup, which is the opposite of what a cleanup step is for.
      #
      # Not aborting is not the same as not reporting. Every command records
      # into `$STATUS` and the step exits non-zero at the end if any of them
      # failed: a green job whose keychain deletion failed says "the signing
      # certificate is gone" about a runner that still has it, and the whole
      # point of doing the cleanup rather than trusting the fleet to discard the
      # runner is that the claim is ours to make good. This cannot hide the real
      # error from a run that failed earlier — that step's own failure is
      # already annotated and already red — it only stops a *cleanup* failure
      # from being the one thing in this job that passes silently.
      - name: Remove the signing keychain
        if: always()
        run: |
          set -uo pipefail
          STATUS=0
          KEYCHAIN="${RUNNER_TEMP}/pisaka-signing.keychain-db"
          if [ -s "${RUNNER_TEMP}/keychains-before" ]; then
            # Unquoted for the same reason as the import step's call: `-s` takes
            # one argument per keychain, and word splitting is what makes them.
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "${RUNNER_TEMP}/keychains-before") || STATUS=1
            rm -f "${RUNNER_TEMP}/keychains-before" || STATUS=1
          fi
          if [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || STATUS=1
          fi
          # Belt and braces for both private keys. Each is removed by the step
          # that wrote it — the .p12 by an `rm` after `security import` consumes
          # it, the .p8 by a `trap … EXIT` — and neither removal covers a
          # cancellation: a `SIGKILL`ed step runs no EXIT trap and no trailing
          # line, which is precisely the path this `if: always()` step exists
          # for. Both paths are spelled out literally because a variable would
          # be one the cancelled step never got to set.
          rm -f "${RUNNER_TEMP}/developer-id.p12" "${RUNNER_TEMP}/notary-key.p8" || STATUS=1
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Cleaning up the signing keychain failed: one of restoring the user search list, deleting the run's keychain or removing the two private keys reported an error (this step's log says which). Every other step's result stands — this failure is about the runner's leftover state, not the release. Assume the runner still holds the Developer ID certificate and the notary key: revoke and reissue the certificate, rotate the notary key, and update the repository secrets before the next tag. See docs/RELEASING.md."
            exit 1
          fi
