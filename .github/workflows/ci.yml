name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  # PRs group by ref so a newer push supersedes the older run. Pushes to master
  # get a unique group (the run id) instead of sharing one: GitHub cancels older
  # *pending* runs in a group even when cancel-in-progress is false, so a shared
  # master group would let rapid pushes A/B/C leave B canceled with no finished
  # CI result. A per-run group means every mainline commit runs to completion.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.3'
      - name: Run PisakaCore tests
        run: swift test

  # No `needs: test` here, on test-macos or on build-ios, on purpose: the build
  # graph does not depend on the Core suite's verdict, and the run's result is
  # wanted as early as its longest job allows. Serialized behind `test`, the wall
  # time was `test` plus the slowest of these. The accepted cost is that a red
  # `swift test` no longer saves these three runners' minutes. release.yml keeps
  # its `needs: test`, because publishing must be gated on a green suite — a
  # separate question from when feedback arrives.
  build-macos:
    runs-on: macos-26
    # Higher than the iOS job's: this one builds Release, so it pays for
    # whole-module optimization across the app and every linked dependency.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.3'
      - name: Install XcodeGen 2.46.0
        run: |
          curl -fsSL --retry 3 -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          sudo xcodegen/install.sh
          xcodegen --version
      # The checkouts are keyed by the Xcode that resolved them as well as by the
      # lock file, so the guard below never reads one toolchain's resolution
      # through another's cache: the first run after a pin bump resolves from
      # scratch under the new Xcode.
      - name: Read the selected Xcode for the cache key
        id: xcode
        run: echo "version=$(xcodebuild -version | head -n 1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM source packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: SourcePackages
          key: spm-${{ steps.xcode.outputs.version }}-${{ hashFiles('Pisaka.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ steps.xcode.outputs.version }}-
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve package dependencies
        run: xcodebuild -project Pisaka.xcodeproj -resolvePackageDependencies -clonedSourcePackagesDirPath SourcePackages
      # Which schema resolution writes depends on the Xcode doing it, and a
      # rewrite (v2 into the legacy v1 shape) hides the one real pin change
      # inside a whole-file diff. This step is what observes the pinned Xcode's
      # behaviour: resolution must leave the committed file byte-identical. It
      # resolves from scratch on a cache miss (always the first run under a new
      # pin, since the key names the Xcode) and over this Xcode's own cached
      # checkouts otherwise. DependencyPinTests' doc comment has the remedy.
      - name: Package.resolved is unchanged by resolution
        run: |
          if ! git diff --exit-code -- Pisaka.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved; then
            echo "::error file=Pisaka.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved::Resolving packages under the pinned Xcode rewrote the committed Package.resolved (diff above). Keep the resolved values and re-emit them in SwiftPM's v2 schema, as DependencyPinTests' doc comment describes; never commit the rewrite."
            exit 1
          fi
      # Release, deliberately, and it is the macOS job that carries it. The whole
      # Sparkle updater is behind `#if !DEBUG` (`SoftwareUpdater.swift`), so a
      # Debug-only gate would never compile `import Sparkle`,
      # `SPUStandardUpdaterController` or the `canCheckForUpdates` republish at
      # all — they would first be built inside the release workflow's archive
      # step, after a tag is already pushed, where a rename in a pinned Sparkle
      # version surfaces as a release-only failure.
      #
      # Be precise about what each macOS job compiles. This Release build is the
      # only compile of the shipping `#if !DEBUG` path; test-macos's Debug build
      # is the only compile of macOS-gated code under `#if DEBUG`. The iOS job
      # cannot stand in for either, because every macOS file is inside
      # `#if os(macOS)` and the iOS compile never reaches it. test-macos exists
      # to host the app-layer bundle, so DEBUG-only content outside the iOS
      # layer is code the shipping configuration never compiles. That is
      # acceptable only because there is exactly one such block outside
      # `Sources/Pisaka/iOS/` and it is the updater's two no-op declarations;
      # SparkleSourceGatingTests holds that bound.
      - name: Build (macOS, Release — the configuration that ships)
        run: >
          xcodebuild -project Pisaka.xcodeproj -scheme Pisaka
          -configuration Release
          -destination 'platform=macOS'
          -clonedSourcePackagesDirPath SourcePackages
          -derivedDataPath DerivedData.noindex
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      # Every other gate in this repository is byte-level. `swift test` compiles
      # Core and reads repository files; the build above proves the app links;
      # the release workflow reads signatures, plists and a notary verdict back
      # off the archive. Not one of them ever *runs* the binary — which is how
      # `v1.0` compiled, linked, signed, notarized, stapled, passed `spctl` and
      # then died in dyld on the first user's machine, unable to resolve
      # `@rpath/Sparkle.framework` because the target carried XcodeGen's
      # iOS-shaped `LD_RUNPATH_SEARCH_PATHS` on macOS too. A dynamic-link failure
      # is invisible until something executes the thing.
      #
      # So this step executes it. The assertion is only that the process *lives*
      # — not that any window appeared or that the UI behaves. Everything the
      # launched app does is inert to it: the Release-only Sparkle updater
      # starting and polling github.com, its first-launch permission prompt,
      # and the document restored from the session this step seeds below.
      #
      # The success path is being killed at the deadline. The app exiting on its
      # own is a refusal *whatever its status*, because a clean `exit 0` seconds
      # after launch is not a working editor either, and because a killed process
      # and a crashed one both report ≥128 — so liveness is polled with `kill -0`
      # rather than told apart from `wait`'s exit code afterwards.
      #
      # The one thing this step assumes, written down because it has not been
      # observed on a hosted runner: that the runner's session can host an
      # AppKit process at all. It `exec`s the executable directly rather than
      # going through `open`, so no LaunchServices and no Dock are involved —
      # but if a GitHub macOS image ever refuses to run a GUI process, this step
      # refuses *every* run, on this workflow and on the release's copy alike.
      # The fallback then is the weaker check — assert only that the captured
      # output carries no dyld "Library not loaded" line — and it is written in
      # docs/RELEASING.md rather than coded here pre-emptively, because a
      # fallback nothing has ever needed is a second path nothing tests.
      #
      # There is no iOS equivalent: CI runs no simulator by design (see the job
      # below, which builds `generic/platform=iOS` and never boots anything), so
      # the iOS product's dynamic loading is still checked by nothing. That is a
      # known limit, recorded in docs/RELEASING.md rather than designed around.
      - name: Launch the built app (smoke test)
        run: |
          set -euo pipefail
          # The one line that differs between this step and its twin in
          # release.yml; ReleaseWorkflowTests asserts everything else is
          # identical, because two hand-maintained copies drifting apart means
          # one half of the pipeline stops checking what the other does.
          APP="DerivedData.noindex/Build/Products/Release/Pisaka.app"
          EXECUTABLE="$APP/Contents/MacOS/Pisaka"
          DEADLINE=5
          LOG="${RUNNER_TEMP:-/tmp}/smoke-launch.log"
          # Touched immediately before the launch so the crash-report search
          # below can tell a report *this* launch produced from one an earlier
          # run left behind — or, on a developer Mac running this script by
          # hand, one from an earlier month.
          MARKER="${RUNNER_TEMP:-/tmp}/smoke-launch.marker"
          # The launch execs the executable directly and passes no arguments
          # — `open --args <path>` was tried and produced no window at all,
          # so the file route was not taken. The document is reached through
          # session restore instead.
          # Deliberately names no build flag: this body is byte-identical in
          # ci.yml and release.yml apart from `APP=`, and the two produce their
          # product in different ways — a `-derivedDataPath` build in ci.yml, an
          # archive in release.yml — so a message naming either one misdirects
          # the reader of the other, during a tagged release in the latter case.
          # Back up the defaults domain before seeding so a hand-run on a
          # developer Mac does not clobber the real session. Restored on every
          # exit path via trap, for the reason the MARKER comment above states:
          # this body is run by hand on developer Macs, where the domain is a
          # real session.
          BACKUP="${RUNNER_TEMP:-/tmp}/pisaka-smoke-defaults.plist"
          defaults export ws.karmanov.pisaka "$BACKUP" 2>/dev/null || true
          restore_defaults() {
            if [ -f "$BACKUP" ]; then
              defaults import ws.karmanov.pisaka "$BACKUP" 2>/dev/null || true
            else
              defaults delete ws.karmanov.pisaka 2>/dev/null || true
            fi
            rm -f "$BACKUP"
          }
          trap restore_defaults EXIT
          # Seed a restorable session so the launch lays out a real document.
          # What the seeded launch proves is what any launch here proves: the
          # process was alive at the deadline. Nothing more — the crash-report
          # harvest below runs only on the death path, so a report is evidence
          # collected when the launch has already failed, never part of the
          # success criterion. The
          # seeding adds no assertion of its own — it hands the app a session so
          # the launch exercises the layout path with a real document instead of
          # an empty window. Nothing here reads the restore back, and
          # EditorSession decodes the blob under `try?`, so a seed that stopped
          # decoding would leave this step green and document-free.
          # What it was measured *not* to prove: with the typesetter fix
          # stashed, the seeded launch survived — the part 1 crash
          # (FoldingTypesetter.init() reached through a re-entrant layout pass)
          # does not fire under it. A regression of that class is caught by the
          # PisakaAppTests bundle, where three tests trapped before the fix
          # (recorded in the part 2 plan's Notes), never by this step.
          # The seeding is kept because a launch with no document proves
          # strictly less, not because it proves that crash.
          # The session lives in UserDefaults under session.projects (a
          # PropertyListEncoder-encoded SessionCatalog), domain ws.karmanov.pisaka.
          # That is the seam the smoke launch seeds.
          FIXTURE="${RUNNER_TEMP:-/tmp}/pisaka-smoke-fixture"
          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE"
          for NAME in Alpha.swift Beta.swift; do
            seq 1 60 | sed 's/.*/let x& = &/' > "$FIXTURE/$NAME"
          done
          HEX="$(FIXTURE="$FIXTURE" python3 <<'PY'
          import plistlib, binascii, os
          fixture = os.environ["FIXTURE"]
          catalog = {
              "entries": [
                  {
                      "folderPath": fixture,
                      "tabs": [
                          {"path": f"{fixture}/Alpha.swift"},
                          {"path": f"{fixture}/Beta.swift"},
                      ],
                      "selectedIndex": 0,
                  }
              ]
          }
          data = plistlib.dumps(catalog, fmt=plistlib.FMT_BINARY)
          print(binascii.hexlify(data).decode())
          PY
          )"
          defaults write ws.karmanov.pisaka session.projects -data "$HEX"
          if ! test -x "$EXECUTABLE"; then
            echo "::error::No executable at ${EXECUTABLE}. The step that produced the bundle reported success, so either the product moved or it is not what this step thinks it is — check that path against the step above that wrote it. See docs/RELEASING.md."
            exit 1
          fi
          : > "$MARKER"
          "$EXECUTABLE" > "$LOG" 2>&1 &
          PID=$!
          ALIVE=1
          for _ in $(seq "$DEADLINE"); do
            sleep 1
            if ! kill -0 "$PID" 2>/dev/null; then
              ALIVE=0
              break
            fi
          done
          if [ "$ALIVE" -eq 0 ]; then
            STATUS=0
            wait "$PID" || STATUS=$?
            cat "$LOG"
            # ReportCrash writes the .ips asynchronously, a second or more after
            # the process is gone, and `kill -0` notices the death within one —
            # so reading the directory once finds nothing on exactly the silent
            # startup crash this harvest exists for. Poll for it instead, bounded
            # by the marker so a stale report is never printed as if it were this
            # one, and say so when the poll expires: "no report was written" is
            # itself evidence, where printing nothing reads like nobody looked.
            CRASH=""
            for _ in $(seq 10); do
              CRASH="$(find "$HOME/Library/Logs/DiagnosticReports" -name 'Pisaka*.ips' -newer "$MARKER" 2>/dev/null | head -1 || true)"
              if [ -n "$CRASH" ]; then
                break
              fi
              sleep 1
            done
            if [ -n "$CRASH" ]; then
              cat "$CRASH"
            else
              echo "No crash report newer than the launch appeared under ~/Library/Logs/DiagnosticReports within 10s."
            fi
            echo "::error::The app exited on its own with status ${STATUS} before the ${DEADLINE}s deadline. The output above is the whole evidence: a 'Library not loaded: @rpath/...' line is a dynamic-link failure — the runpath the executable searches does not reach Contents/Frameworks/, which is what LD_RUNPATH_SEARCH_PATHS[sdk=macosx*] in project.yml exists to set. Any other output is a crash in startup. This step refuses whatever the status is, including 0. See docs/RELEASING.md."
            exit 1
          fi
          # SIGTERM, a grace period, then SIGKILL — the teardown every other
          # process owner in this repository uses, for the reason that applies
          # here too: `wait` on a process that does not die blocks until the
          # job's own budget expires, which reports as a cancelled build rather
          # than as anything about the app. That is the exact failure the launch
          # is backgrounded to avoid, and it must not come back on the way out.
          # SIGKILL cannot be ignored, so the `wait` below always returns.
          kill "$PID" 2>/dev/null || true
          sleep 2
          kill -9 "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo "The app survived ${DEADLINE}s and was terminated by this step."

  # The app-layer test bundle has a job of its own so that it runs in parallel
  # with the Release build above instead of in front of it. That gives up the
  # old ordering — failing before building what would not launch — for wall
  # time. The trap the bundle names is still caught on every run, whichever job
  # builds the product, and build-macos's smoke launch still executes the
  # shipped product after its build.
  test-macos:
    runs-on: macos-26
    # A Debug build plus the bundle, 4–7.5 minutes measured; the iOS job's
    # budget is the ceiling.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.3'
      - name: Install XcodeGen 2.46.0
        run: |
          curl -fsSL --retry 3 -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          sudo xcodegen/install.sh
          xcodegen --version
      # The checkouts are keyed by the Xcode that resolved them as well as by the
      # lock file, so the guard below never reads one toolchain's resolution
      # through another's cache: the first run after a pin bump resolves from
      # scratch under the new Xcode.
      - name: Read the selected Xcode for the cache key
        id: xcode
        run: echo "version=$(xcodebuild -version | head -n 1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM source packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: SourcePackages
          key: spm-${{ steps.xcode.outputs.version }}-${{ hashFiles('Pisaka.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ steps.xcode.outputs.version }}-
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve package dependencies
        run: xcodebuild -project Pisaka.xcodeproj -resolvePackageDependencies -clonedSourcePackagesDirPath SourcePackages
      # Which schema resolution writes depends on the Xcode doing it, and a
      # rewrite (v2 into the legacy v1 shape) hides the one real pin change
      # inside a whole-file diff. This step is what observes the pinned Xcode's
      # behaviour: resolution must leave the committed file byte-identical. It
      # resolves from scratch on a cache miss (always the first run under a new
      # pin, since the key names the Xcode) and over this Xcode's own cached
      # checkouts otherwise. DependencyPinTests' doc comment has the remedy.
      - name: Package.resolved is unchanged by resolution
        run: |
          if ! git diff --exit-code -- Pisaka.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved; then
            echo "::error file=Pisaka.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved::Resolving packages under the pinned Xcode rewrote the committed Package.resolved (diff above). Keep the resolved values and re-emit them in SwiftPM's v2 schema, as DependencyPinTests' doc comment describes; never commit the rewrite."
            exit 1
          fi
      # The app-layer test bundle that `swift test` structurally cannot cover: it
      # drives `NSTextView`/`NSLayoutManager`/`NSATSTypesetter` subclasses with
      # behaviour of their own (the bracket overlay, the folding typesetter),
      # whose launch-time trap no Core gate could see, plus the app-layer rules
      # with no Core seam at all — the download collector's ceiling and its
      # cancellation mapping (`core-provisioning.md`). It runs in Debug because
      # the app's own Debug configuration is what the test host builds, and the
      # trap is present in both.
      - name: Test the AppKit overlay (PisakaAppTests)
        run: >
          xcodebuild -project Pisaka.xcodeproj -scheme Pisaka
          -destination 'platform=macOS'
          -clonedSourcePackagesDirPath SourcePackages
          -derivedDataPath DerivedData.noindex
          -resultBundlePath build.noindex/PisakaAppTests.xcresult
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      # A test that fails only on the runner's OS has now happened twice, and the
      # log carries nothing but the assertion's text. The result bundle holds what
      # a failing test attached (today the commit diff's trailing-edge read, the
      # bitmap it read), so a CI-only failure can be diagnosed without another
      # round trip. It is kept on failure only: an upload costs time and storage
      # on every run, and a green gate stays quiet. `ignore` keeps a failure before the test step,
      # which leaves no bundle, from being reported as a missing artifact instead
      # of as itself. The one `if:` ci.yml carries; every gate step stays
      # unconditional (ReleaseWorkflowTests).
      - name: Upload the test result bundle (failure only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PisakaAppTests-xcresult
          path: build.noindex/PisakaAppTests.xcresult
          retention-days: 7
          if-no-files-found: ignore

  build-ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.3'
      - name: Install XcodeGen 2.46.0
        run: |
          curl -fsSL --retry 3 -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          sudo xcodegen/install.sh
          xcodegen --version
      # The checkouts are keyed by the Xcode that resolved them as well as by the
      # lock file, so the guard below never reads one toolchain's resolution
      # through another's cache: the first run after a pin bump resolves from
      # scratch under the new Xcode.
      - name: Read the selected Xcode for the cache key
        id: xcode
        run: echo "version=$(xcodebuild -version | head -n 1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM source packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: SourcePackages
          key: spm-${{ steps.xcode.outputs.version }}-${{ hashFiles('Pisaka.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ steps.xcode.outputs.version }}-
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve package dependencies
        run: xcodebuild -project Pisaka.xcodeproj -resolvePackageDependencies -clonedSourcePackagesDirPath SourcePackages
      # Which schema resolution writes depends on the Xcode doing it, and a
      # rewrite (v2 into the legacy v1 shape) hides the one real pin change
      # inside a whole-file diff. This step is what observes the pinned Xcode's
      # behaviour: resolution must leave the committed file byte-identical. It
      # resolves from scratch on a cache miss (always the first run under a new
      # pin, since the key names the Xcode) and over this Xcode's own cached
      # checkouts otherwise. DependencyPinTests' doc comment has the remedy.
      - name: Package.resolved is unchanged by resolution
        run: |
          if ! git diff --exit-code -- Pisaka.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved; then
            echo "::error file=Pisaka.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved::Resolving packages under the pinned Xcode rewrote the committed Package.resolved (diff above). Keep the resolved values and re-emit them in SwiftPM's v2 schema, as DependencyPinTests' doc comment describes; never commit the rewrite."
            exit 1
          fi
      - name: Build (iOS)
        run: >
          xcodebuild -project Pisaka.xcodeproj -scheme Pisaka
          -destination 'generic/platform=iOS'
          -clonedSourcePackagesDirPath SourcePackages
          -derivedDataPath DerivedData.noindex
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  # CI is the real gate for style. The pre-commit hook is only local courtesy:
  # git does not clone hooks (.githooks/ needs a one-time `git config
  # core.hooksPath .githooks` per clone) and any commit can bypass them with
  # `--no-verify`. This job refuses the pull request itself, so a bypassed or
  # never-installed hook merely defers the failure to here.
  #
  # No `needs:` on purpose: style is independent of the build graph, so this job
  # should give the fastest possible feedback of any job in the file.
  #
  # The version comes from the release asset whose digest is checked below —
  # the same pin `.swiftlint.yml` declares and the pre-commit hook reads.
  # LintConfigurationTests fails if those three ever disagree.
  lint:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SwiftLint 0.65.1
        run: |
          curl -fsSL --retry 3 -o swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  swiftlint.zip" | shasum -a 256 -c -
          # Only the binary is extracted, by name. The archive also carries a
          # `LICENSE`, and this runs in the checkout, which has its own — a bare
          # `unzip` prompts to replace it, reads EOF on a runner, answers "None"
          # and exits 1, so the job died before linting anything. Extracting the
          # whole archive with `-o` would be worse than the failure: it would
          # overwrite this repository's LICENSE with SwiftLint's.
          unzip -q -o swiftlint.zip swiftlint
          chmod +x swiftlint
      - name: Record the SwiftLint version doing the judging
        run: ./swiftlint --version
      - name: Lint (--strict, from the repository root)
        run: ./swiftlint lint --strict
