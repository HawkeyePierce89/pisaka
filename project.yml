name: Pisaka

# XcodeGen project for the Pisaka app. One multiplatform application target that
# builds for both macOS 13 and iOS 17 (the modern Xcode "multiplatform app", a
# single target with multiple supported destinations). `swift run Pisaka` is gone
# — build/run through this generated project (`xcodegen generate` then
# `xcodebuild`/Xcode).
#
# Dependency split (see Package.swift for why each is pinned as it is):
#   - PisakaCore .............. local SwiftPM package (path "."), all platforms
#   - Neon / SwiftTreeSitter / Rearrange + tree-sitter grammars .. all platforms
#   - SwiftTerm ............... embedded terminal; used only by macOS-gated code
#   - libgit2 ................. iOS `GitServicing`; used only by iOS-gated code
#   - Sparkle ................. auto-update; macOS-only *by declaration*, and the
#                               one dependency carrying a `destinationFilters:`
#
# Per-destination linking: a package-product dependency on a multiplatform target
# **can** be filtered per destination. `destinationFilters: [macOS]` emits
# `platformFilters = (macos, )` on the generated `PBXBuildFile`, and
# `generic/platform=iOS` then builds green with the package still in the
# resolution graph. (An earlier note here claimed the opposite — that
# package-product dependencies are all-or-nothing per target, unlike framework
# build files. That was wrong; it was checked against a scratch XcodeGen project
# and against this project's own iOS build before Sparkle was added.)
#
# The `#if os(macOS)` / `#if os(iOS)` source gating stays the *primary*
# enforcement regardless: a filter decides what links, the source rule decides
# what compiles, and only the second one fails loudly when someone imports the
# wrong thing from the wrong file.
#
# SwiftTerm is intended for macOS only. All terminal source (`TerminalSession`,
# `TerminalPanelView`, `TerminalSessionsModel`) is wrapped in `#if os(macOS)`, so
# it is never imported on iOS. SwiftTerm itself supports iOS 13+, so it links
# cleanly into the iOS app as unused dead weight rather than breaking the build;
# libgit2 links the same way, unused, on macOS. Both *could* now carry
# `destinationFilters:` the way Sparkle does — a noted follow-up, deliberately
# not done here: they are declared as supporting both platforms, so today they
# cost bundle size rather than correctness, and changing what links into the
# shipping app is a separate change with its own verification.
# Exact version/revision pins mirror the committed Package.resolved.

options:
  bundleIdPrefix: ws.karmanov.pisaka
  deploymentTarget:
    macOS: "13.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PisakaCore:
    path: .
  Neon:
    url: https://github.com/ChimeHQ/Neon
    revision: 484d6fb9e0c4fb679a1d5f5ddaf2cac2ecf21165
  # SwiftTreeSitter is the one dependency this file cannot pin by revision, and
  # the reason is Neon's manifest, not a choice made here: the pinned Neon
  # revision (484d6fb, 119 commits past its newest tag 0.6.0 — no Neon tag
  # carries the API the app uses) declares
  #   .package(url: ".../SwiftTreeSitter", branch: "main")
  # and SwiftPM refuses to resolve a package that is "required using two
  # different revision-based requirements" — a root `revision:` here plus Neon's
  # `branch: main` is exactly that, and `xcodebuild -resolvePackageDependencies`
  # fails outright. An `exactVersion:` fares no better (version vs. revision
  # requirement). So the requirement stays `branch: main` and the *pin* lives
  # where SwiftPM will honour it: the committed Package.resolved records
  # revision 0f40435cdb41673ce4194d731571cf2a2f7c3285 (3 commits past tag
  # 0.10.0), the revision that has been building and testing all along, and
  # resolution reuses it until someone explicitly updates.
  # `DependencyPinTests` asserts that exact revision and that swifttreesitter is
  # the *only* branch-based pin in the file, so an unnoticed drift to a newer
  # main — or a second branch dependency creeping in — fails the suite.
  # To remove the branch requirement entirely, Neon itself must move to a tag
  # whose manifest asks for SwiftTreeSitter by version; that is a Neon-pin
  # change with real API risk, deliberately not bundled into the release prep.
  SwiftTreeSitter:
    url: https://github.com/ChimeHQ/SwiftTreeSitter
    branch: main
  Rearrange:
    url: https://github.com/ChimeHQ/Rearrange
    exactVersion: "2.1.1"
  tree-sitter-swift:
    url: https://github.com/alex-pinkus/tree-sitter-swift
    exactVersion: "0.7.3-with-generated-files"
  tree-sitter-json:
    url: https://github.com/tree-sitter/tree-sitter-json
    exactVersion: "0.24.8"
  tree-sitter-javascript:
    url: https://github.com/tree-sitter/tree-sitter-javascript
    exactVersion: "0.23.1"
  tree-sitter-typescript:
    url: https://github.com/tree-sitter/tree-sitter-typescript
    exactVersion: "0.23.2"
  tree-sitter-python:
    url: https://github.com/tree-sitter/tree-sitter-python
    exactVersion: "0.23.6"
  tree-sitter-html:
    url: https://github.com/tree-sitter/tree-sitter-html
    exactVersion: "0.23.2"
  tree-sitter-css:
    url: https://github.com/tree-sitter/tree-sitter-css
    exactVersion: "0.23.2"
  tree-sitter-markdown:
    url: https://github.com/tree-sitter-grammars/tree-sitter-markdown
    exactVersion: "0.5.3"
  tree-sitter-yaml:
    url: https://github.com/tree-sitter-grammars/tree-sitter-yaml
    exactVersion: "0.7.0"
  tree-sitter-dockerfile:
    url: https://github.com/camdencheek/tree-sitter-dockerfile
    exactVersion: "0.2.0"
  # Go's grammar needs no vendoring and no manifest fix: upstream ships a SwiftPM
  # manifest whose package *and* target are both named `TreeSitterGo` (so the
  # resource bundle is the `TreeSitterGo_TreeSitterGo` that
  # `LanguageConfiguration(…, name: "Go")` expects), a `bindings/swift` header and
  # `queries/highlights.scm`. Its `sources:` is `["src/parser.c"]` alone — no
  # external scanner, so none of the TreeSitterDotenv link-time trouble. Its
  # manifest names SwiftTreeSitter, but only from its *test* target, and SwiftPM
  # prunes a non-root package's test-only dependencies, so this adds exactly one
  # pin and does not collide with ChimeHQ's SwiftTreeSitter above.
  tree-sitter-go:
    url: https://github.com/tree-sitter/tree-sitter-go
    exactVersion: "0.25.0"
  # Rust's grammar is pinned remotely and vendored nowhere, and the two facts
  # that decide that were read out of the manifest at this exact revision rather
  # than assumed:
  #   * its `sources:` is `["src/parser.c", "src/scanner.c"]` — the grammar
  #     declares an external scanner and upstream *does* compile it, so this is
  #     not the `TreeSitterDotenv` failure mode (a manifest that omits
  #     `src/scanner.c` and leaves the consuming app with undefined
  #     `..._external_scanner_*` symbols at link time). The iOS device build is
  #     the standing link-time proof.
  #   * its manifest names ChimeHQ/SwiftTreeSitter — the same package identity
  #     the root pins `branch: main` above — but only from its *test* target, and
  #     SwiftPM prunes a non-root package's test-only dependencies. So this adds
  #     exactly one pin and provokes no "required using two different
  #     requirements" failure, exactly as `tree-sitter-python` and
  #     `tree-sitter-css` (which declare the same dependency) already prove.
  # Package *and* target are both `TreeSitterRust`, so the resource bundle is the
  # `TreeSitterRust_TreeSitterRust` that `LanguageConfiguration(…, name: "Rust")`
  # expects, and `bindings/swift` + `queries/highlights.scm` both ship.
  tree-sitter-rust:
    url: https://github.com/tree-sitter/tree-sitter-rust
    exactVersion: "0.24.2"
  # dotenv is vendored for a different reason than gitignore below: upstream
  # (pnx/tree-sitter-dotenv v1.1.1) *does* ship a SwiftPM manifest, but its
  # `sources:` omits `src/scanner.c` while the grammar declares an external
  # scanner — so the package compiles and then fails to link the consuming app
  # with five undefined `tree_sitter_dotenv_external_scanner_*` symbols. The same
  # omission is on upstream `main`, so no remote version links. The vendored copy
  # is byte-identical to the v1.1.1 tag apart from that one-line manifest fix; see
  # `Vendor/TreeSitterDotenv/VENDORED.md`, which also records how to drop this
  # directory and restore the remote pin if upstream ever fixes it.
  TreeSitterDotenv:
    path: Vendor/TreeSitterDotenv
  # gitignore is vendored because there is nothing to depend on remotely at all:
  # upstream (shunsambongi/tree-sitter-gitignore) publishes no SwiftPM
  # manifest, no `bindings/swift` header and no `queries/highlights.scm` — the
  # Swift binding and the highlight query
  # are written in this repo. `Vendor/TreeSitterGitignore/VENDORED.md` records the
  # upstream SHA, what is copied verbatim vs. authored here, and the per-element
  # query-verification recipe that must be re-run on every grammar update (both
  # failure modes of a hand-written query are silent in the app: an unknown node
  # name fails query compilation and degrades the file to plain text, a mistyped
  # capture name resolves to `SyntaxTokenKind.plain`, i.e. default-colored text).
  # A local path dependency adds no entry to Package.resolved.
  TreeSitterGitignore:
    path: Vendor/TreeSitterGitignore
  # SQL is vendored for two independent reasons: the tagged upstream tree ships
  # no generated `src/parser.c` (it is gitignored), so its manifest's `sources:`
  # names a file that does not exist; and its own manifest is a hard SwiftPM
  # error through its test target's undeclared `SwiftTreeSitter` dependency. The
  # generated files are copied from the npm tarball. See
  # `Vendor/TreeSitterSql/VENDORED.md` for the full reason and update procedure.
  TreeSitterSql:
    path: Vendor/TreeSitterSql
  # Editorconfig is vendored because upstream ships neither a SwiftPM manifest
  # nor a Swift binding. See `Vendor/TreeSitterEditorconfig/VENDORED.md`.
  TreeSitterEditorconfig:
    path: Vendor/TreeSitterEditorconfig
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.5.0"
  # libgit2, built from C source (CommonCrypto/SecureTransport on Apple) by SwiftPM
  # rather than vended as a binary xcframework. Source compilation means every
  # destination (macOS, iOS device, iOS simulator) gets a natively-built slice, so
  # there is no xcframework-slice-coverage problem when the single multiplatform
  # target links it into every destination. Used only by iOS-gated code
  # (`LibGit2Service`, the iOS `GitServicing`); on macOS it links as unused dead
  # weight (macOS uses the `Process`-backed `GitCLIService`), exactly as SwiftTerm
  # links unused on iOS. Pinned exact, like the grammar packages.
  libgit2:
    url: https://github.com/ibrahimcetin/libgit2
    exactVersion: "1.9.2"
  # Sparkle 2, the macOS auto-update framework. Four things about this pin are
  # different from every other entry above and are worth stating rather than
  # rediscovering:
  #   * It is a SwiftPM **binaryTarget** package: the manifest at tag 2.9.5 does
  #     not build Sparkle from source, it points at a prebuilt
  #     `Sparkle.xcframework` and pins it by its own `checksum:`. So the bytes
  #     that ship are pinned twice over — by `exactVersion:` here (mirrored in
  #     `Package.resolved`, asserted by `DependencyPinTests`) and by that
  #     checksum inside upstream's manifest, which SwiftPM verifies on download.
  #   * It is macOS-only **by declaration** — its manifest says
  #     `platforms: [.macOS(.v10_13)]` — unlike SwiftTerm and libgit2, which
  #     support both platforms and merely go unused on one. An unfiltered
  #     dependency here would therefore not "link as dead weight" on iOS; it
  #     would break the iOS build outright. Hence the `destinationFilters:` on
  #     the dependency below, and hence the `generic/platform=iOS` build being
  #     the acceptance gate for that filter.
  #   * Everything that imports it (`SoftwareUpdater.swift`) is inside
  #     `#if os(macOS)`, as always.
  #   * **It ships nested code, and bumping this version invalidates two path
  #     lists outside this file.** The xcframework is not one binary but five:
  #     `Versions/B/Sparkle` plus four helper bundles — `Versions/B/Autoupdate`,
  #     `Versions/B/Updater.app` and the XPC services `Downloader.xpc` and
  #     `Installer.xpc` — each arriving with upstream's *ad-hoc* signature.
  #     Xcode's archive re-signs the framework bundle and does not recurse into
  #     them, which is what got `v1.0` rejected by the notary service, so
  #     `.github/workflows/release.yml` re-signs those four by explicit path and
  #     verifies every Mach-O in the app. A version whose layout moves any of
  #     them makes both lists stale; the workflow refuses rather than shipping,
  #     but only on a pushed tag, after the archive. Re-derive them first —
  #     `docs/RELEASING.md`'s "Upgrading Sparkle" carries the recipe.
  # Its LICENSE already aggregates the external notices for bsdiff (Colin
  # Percival), sais-lite (Yuta Mori), the portable C ed25519 implementation
  # (orlp/ed25519, Orson Peters) and SUSignatureVerifier.m (Mark Hamlin), so
  # `Resources/Licenses/Sparkle.txt` is that file verbatim with nothing
  # appended — pinned by `LicenseCoverageTests`.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.5"

targets:
  Pisaka:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources/Pisaka
      # The privacy manifest, declared as a single-file resource rather than by
      # letting the recursive `Sources/Pisaka` entry pick it up — it lives under
      # `Resources/`, next to the partial Info.plist, and naming the file (not the
      # directory) keeps `Resources/Info.plist` out of the resources phase, where
      # it would be copied into the bundle a second time alongside the merged
      # `Info.plist` Xcode generates from it. A plain file reference (not a folder
      # reference) is what puts it at the *top level* of the built bundle's
      # resources on both destinations — `Contents/Resources/PrivacyInfo.xcprivacy`
      # on macOS, `PrivacyInfo.xcprivacy` at the `.app` root on iOS — which is the
      # only place App Store Connect's privacy-report aggregation looks. Its
      # contents and the required-reason audit behind them are documented in
      # `docs/architecture/core-services.md` and asserted by `ReleaseMetadataTests`.
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Third-party license texts, declared as a *folder reference*
      # (`type: folder`) rather than a group of individual file references: the
      # directory itself is copied into the bundle verbatim, so it lands as
      # `Licenses/` (holding `licenses.json` plus one `.txt` per shipped
      # dependency) and adding or replacing a text needs no `xcodegen generate`
      # — the build copies whatever the directory currently contains. That is
      # also why the manifest, not the project file, is the list of record:
      # `LicenseCoverageTests` asserts `licenses.json` covers exactly the
      # packages this file links (plus the transitive `tree-sitter` runtime) at
      # exactly the revisions `Package.resolved` pins, so a new dependency fails
      # the suite until its license ships. `Acknowledgements` reads it through
      # `Bundle.main`.
      - path: Resources/Licenses
        type: folder
      # The `symbols.scm` tree-sitter queries that drive the project symbol
      # index (go-to-definition, autocompletion), declared as a *folder
      # reference* for the same reason as `Licenses/`: the directory is copied
      # verbatim, so it lands as `Queries/<language>/symbols.scm` in the bundle
      # and adding a language's query needs no `xcodegen generate`.
      # `SymbolQueryCatalog` resolves them through `Bundle.main`; a query that
      # does not reach the bundle degrades that language to "no symbols", which
      # looks exactly like a file that declares nothing — hence the folder
      # reference is asserted by `ReleaseMetadataTests` and the queries
      # themselves by `SymbolQueryTests`.
      - path: Resources/Queries
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ws.karmanov.pisaka
        PRODUCT_NAME: Pisaka
        # `Resources/Info.plist` is a *partial* plist: it carries only the keys
        # Xcode has no `INFOPLIST_KEY_*` equivalent worth using for — the two App
        # Store Connect validation wants (`LSApplicationCategoryType` and a
        # real-Boolean `ITSAppUsesNonExemptEncryption`) plus the two Sparkle
        # reads out of the main bundle (`SUFeedURL`, `SUPublicEDKey`), which
        # `GENERATE_INFOPLIST_FILE` cannot produce at all.
        # `ReleaseMetadataTests` pins that set of four, and the release workflow
        # re-checks each one on the *archived* app.
        # `GENERATE_INFOPLIST_FILE` stays YES,
        # so Xcode merges its generated per-destination keys (CFBundleName,
        # CFBundleShortVersionString, the scene/principal-class keys, every
        # `INFOPLIST_KEY_*` below) *into* this file's contents rather than
        # replacing them — the built plist is the union. Task 8 of the release
        # plan verifies that union with `plutil -p` on both destinations.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Resources/Info.plist
        # The release version. `CURRENT_PROJECT_VERSION` stays a plain monotonic
        # integer and is *not* bumped in the working tree per upload: App Store
        # Connect only requires each upload to carry a build number never seen
        # before, so uploads override it on the `xcodebuild archive` command line
        # (`CURRENT_PROJECT_VERSION=<n>`), which beats the project value and
        # leaves the tree clean. See docs/RELEASING.md.
        MARKETING_VERSION: "1.4"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        # The macOS runpath, and the one setting in this file that only a
        # *launched* app dereferences. XcodeGen's default for an application
        # target is iOS-shaped — `$(inherited)` plus `@executable_path/Frameworks`
        # — and a multiplatform target gets it, unconditionally, on both
        # destinations. That is right on iOS, where the executable sits at the
        # `.app` root beside `Frameworks/`, and wrong on macOS, where the
        # executable is in `Contents/MacOS/` and embedded frameworks in
        # `Contents/Frameworks/`: dyld searches `Contents/MacOS/Frameworks/`,
        # finds nothing, and the process aborts before `main`.
        #
        # Nothing dereferenced it until Sparkle (R-1) became the first embedded
        # dynamic framework this app ever links, so a wrong default survived from
        # the first commit until the published `v1.0` died at launch with
        # `Library not loaded: @rpath/Sparkle.framework/Versions/B/Sparkle`. Every
        # gate was green: the build links against the framework's stub, the
        # signature, plist and notarization checks are all byte-level, and nothing
        # between the compiler and the user had ever executed the binary. The two
        # smoke launches in `ci.yml` and `release.yml` are the structural answer;
        # this line is the fix. The whole incident is in `docs/RELEASING.md`.
        #
        # An `[sdk=macosx*]` condition rather than a rewritten unconditional
        # value, so the iOS destination keeps XcodeGen's preset exactly as it
        # was — verified by rebuilding `generic/platform=iOS` and re-reading its
        # `LC_RPATH` set (`@executable_path`, the PackageFrameworks entry,
        # `@executable_path/Frameworks`), which is unchanged. XcodeGen passes
        # the bracketed key through verbatim into both configurations.
        #
        # What `$(inherited)` picks up here was measured, not assumed: Xcode
        # layers the conditional assignment on top of the *same-level*
        # unconditional one, so the macOS product ends up with both
        # `@executable_path/Frameworks` (inherited, and simply never resolves to
        # anything) and `@executable_path/../Frameworks` (the one that does).
        # Dropping `$(inherited)` would prune the dead entry and is deliberately
        # not done: it would also drop whatever a future project-level or
        # xcconfig value contributes, to buy nothing but a shorter `otool`
        # listing.
        #
        # `/usr/lib/swift` is *not* this setting's to preserve: the Swift
        # toolchain emits that `LC_RPATH` itself, so overriding the search paths
        # cannot lose it. Verified with `otool -l` on the Release product rather
        # than assumed. `ReleaseMetadataTests` pins these three lines, because a
        # build without them is green and only a launch can tell.
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]:
          - $(inherited)
          - "@executable_path/../Frameworks"
        INFOPLIST_KEY_CFBundleDisplayName: Pisaka
        # The iOS document picker opens folders/files in place (`asCopy: false`) and
        # the app persists security-scoped bookmarks to edit/save/run-git against the
        # picked location, so in-place document access must be granted (without this
        # the picker only vends copies and the scoped-file-access design fails on
        # device). No-op on macOS.
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        # Expose the iOS app container's `Documents` directory in the Files app
        # ("On My iPhone → Pisaka"). The LeetCode integration defaults its
        # solutions folder to `Documents/LeetCode` precisely so no picker and no
        # bookmark are needed, and without this key those files are reachable
        # only from inside the app. A deliberate consequence: the *whole*
        # container `Documents` becomes user-visible — today the LeetCode folder
        # is the only thing the app puts there, and anything added later must be
        # content a user may see and delete (caches belong in Application
        # Support, which stays private). No-op on macOS, like the two iOS keys
        # around it. `ReleaseMetadataTests` asserts this line, because nothing
        # else in the build would notice its removal.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        # The iOS launch screen. Apple has required every app built against the
        # iOS 13+ SDK to declare one since April 2020; an app without it is
        # rejected by App Store Connect validation and, until then, runs
        # letterboxed in compatibility mode (no full-screen layout, no iPad
        # multitasking) — which is exactly what this app looked like, since a
        # SwiftUI `@main` app has no storyboard and `GENERATE_INFOPLIST_FILE`
        # does not add the key on its own. `YES` makes Xcode generate an empty
        # `UILaunchScreen` dictionary, the modern replacement for a launch
        # storyboard: a blank launch surface in the system background colour,
        # which is what a code editor that opens onto its own chrome wants. Like
        # `LSSupportsOpeningDocumentsInPlace` above, the generated key lands in
        # the macOS plist too (one base setting, both destinations) where it is
        # simply never read — AppKit has no launch screen. `ReleaseMetadataTests`
        # asserts this line, because nothing else in the build would notice its
        # removal.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        # The app icon lives in Sources/Pisaka/Assets.xcassets/AppIcon.appiconset —
        # a single combined set carrying both the iOS (iphone/ipad/ios-marketing)
        # and macOS (mac) idioms, so one setting covers every destination of the
        # multiplatform target. The .xcassets under the target's source path is
        # picked up as a resource automatically by XcodeGen.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    dependencies:
      - package: PisakaCore
        product: PisakaCore
      - package: Neon
        product: Neon
      - package: SwiftTreeSitter
        product: SwiftTreeSitter
      - package: Rearrange
        product: Rearrange
      - package: tree-sitter-swift
        product: TreeSitterSwift
      - package: tree-sitter-json
        product: TreeSitterJSON
      - package: tree-sitter-javascript
        product: TreeSitterJavaScript
      - package: tree-sitter-typescript
        product: TreeSitterTypeScript
      - package: tree-sitter-python
        product: TreeSitterPython
      - package: tree-sitter-html
        product: TreeSitterHTML
      - package: tree-sitter-css
        product: TreeSitterCSS
      - package: tree-sitter-markdown
        product: TreeSitterMarkdown
      - package: tree-sitter-yaml
        product: TreeSitterYAML
      - package: tree-sitter-dockerfile
        product: TreeSitterDockerfile
      - package: tree-sitter-go
        product: TreeSitterGo
      - package: tree-sitter-rust
        product: TreeSitterRust
      - package: TreeSitterDotenv
        product: TreeSitterDotenv
      - package: TreeSitterGitignore
        product: TreeSitterGitignore
      - package: TreeSitterSql
        product: TreeSitterSql
      - package: TreeSitterEditorconfig
        product: TreeSitterEditorconfig
      - package: SwiftTerm
        product: SwiftTerm
      - package: libgit2
        product: libgit2
      # The one filtered dependency: Sparkle's manifest declares macOS only, so
      # linking it into the iOS destination is not dead weight but a broken
      # build. `destinationFilters: [macOS]` becomes `platformFilters =
      # (macos, )` on the generated build file; the iOS build then resolves the
      # package and links nothing from it.
      - package: Sparkle
        product: Sparkle
        destinationFilters: [macOS]
    # Wires this clone's git hooks in, on the one action every builder performs.
    #
    # Git never enables a repository's hooks by itself — `.git/hooks` is not
    # cloned and `core.hooksPath` is per-clone local config — because a
    # repository that could run its own scripts on `git clone` would be remote
    # code execution. Every ecosystem that appears to install hooks
    # "automatically" (husky's `prepare` script under `npm install`) is really
    # riding on a step the developer had to run anyway. SwiftPM offers no such
    # step: its manifest is evaluated in a sandbox, so `Package.swift` cannot
    # have side effects, and `swift test` needs no dependency install at all
    # (PisakaCore is Foundation-only by design). A build phase is therefore the
    # one place in this project where something of ours runs unprompted, which
    # is why the wiring lives here rather than in a setup script nobody runs.
    #
    # Idempotent: `git config` writes the same value every time. Silent on
    # success so it costs a build nothing to read.
    #
    # It exits 0 when there is no git repository (an export, a tarball, a
    # sandboxed CI checkout without `.git`). That is not the "graceful skip"
    # the pre-commit hook deliberately refuses to make: this script only
    # *enables* a gate, and failing a build because hooks cannot be wired would
    # break building for a reason that has nothing to do with the build. The
    # gate itself still refuses hard, and CI still refuses the pull request.
    preBuildScripts:
      - name: Wire git hooks (core.hooksPath)
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          cd "$SRCROOT"
          git rev-parse --git-dir >/dev/null 2>&1 || exit 0
          git config core.hooksPath .githooks
  # PisakaAppTests — the headless AppKit test bundle that exercises the
  # editor's real TextKit stack (BracketOverlayLayoutManager, FoldingTypesetter,
  # LineNumberRulerView). It is an **application host test**: `@testable import
  # Pisaka` against an application target only links with a TEST_HOST /
  # BUNDLE_LOADER (the host's executable), which is why those two settings are
  # declared explicitly below — XcodeGen's preset does not guarantee them for an
  # `application` host, and verifying by building is the only honest check. It is
  # **macOS-only** because every file it exercises is inside `#if os(macOS)`;
  # building it for iOS would import AppKit on a destination that does not ship
  # it.
  PisakaAppTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources: [Tests/PisakaAppTests]
    dependencies:
      - target: Pisaka
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pisaka.app/Contents/MacOS/Pisaka
        BUNDLE_LOADER: $(TEST_HOST)

# The generated project ships its scheme from this block
# (Pisaka.xcodeproj/xcshareddata/xcschemes/Pisaka.xcscheme); before it
# `xcodebuild -scheme Pisaka` worked off an autocreated one and a test
# action could not be relied on there, so this block makes the scheme
# explicit: build action = the app, test action = PisakaAppTests. The
# iOS build below (`generic/platform=iOS`) then inherits the same scheme
# but the macOS-only test target does not reach it, which
# `xcodebuild build -scheme Pisaka -destination 'generic/platform=iOS'` proves.
schemes:
  Pisaka:
    build:
      targets:
        Pisaka: all
    test:
      config: Debug
      targets:
        - PisakaAppTests
